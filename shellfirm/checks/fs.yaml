- from: fs
  # Same targets as fs:recursively_chmod, plus a home directory by its absolute
  # path and its `.ssh` / `.gnupg` (`chown -R dev ./src` and
  # `chown -R dev /home/dev/project` are fine).
  test: '(?:^|\s)chown\s+(?:\S+\s+)*(?:-[a-zA-Z]*R[a-zA-Z]*|--recursive)\s+(?:\S+\s+)*(/\*?|~(?:/\*)?|\$HOME(?:/\*)?|(?:~|\$HOME)/\.(?:ssh|gnupg)\S*|\.+|\*|/(?:home|etc|usr|var|bin|sbin|lib|lib64|boot|opt|root|srv|Users|Library|System)(?:/\*)?|/(?:home|Users)/[^/\s]+(?:/\*?|/\.(?:ssh|gnupg)\S*)?)(?:\s|$)'
  description: "Recursively changing the owner of the root, home or current directory, a system directory or your SSH keys can break the system and lock you out."
  id: fs:recursively_chown
  severity: Critical
  filters:
    # Taking ownership of your own project or home directory (`sudo chown -R
    # $USER .` after a `sudo npm install`, `chown -R dev:dev ~/projects/webapp`,
    # `sudo chown -R $(whoami) ~`): your own user, written as
    # `$USER`, `$LOGNAME`, `$(whoami)` or `$(id -u)`. Your home's dot
    # directories (`~/.ssh`) and other users' homes stay critical.
    - type: NotMatches
      value: '^chown(?:\s+-\S+)*\s+(?:\$\{?(?:USER|LOGNAME)\}?|\$\(whoami\)|\$\(id\s+-u?n?\))(?:[:.]\S*)?(?:\s+-\S+)*(?:\s+(?:\.|\*|(?:~|\$HOME|\$\{HOME\})/?|(?:~|\$HOME|\$\{HOME\}|/(?:home|Users)/[^/\s]+)/[^.\s]\S*))+$'
- from: fs
  test: (?:^|\s)shred\s+
  description: "Shred overwrites file data at the block level, making recovery impossible unlike rm."
  id: fs:shred
  severity: High
  alternative: "rm <file>"
  alternative_info: "Regular rm only unlinks the file. Use shred only when you truly need irrecoverable deletion."
- from: fs
  test: (?:^|\s)truncate\s+(?:\S+\s+)*?-s\s*0\s+(?:\S+\s+)*?([^-\s]\S*)
  description: "This truncates the file to zero bytes and erases its contents."
  id: fs:truncate_zero
  severity: High
  filters:
    # A file that does not exist is only created (empty).
    - type: PathExists
      value: 1
    # Emptying log files, like `: > app.log`.
    - type: NotMatches
      value: '^truncate\s+(?:-\S+\s+)*-s\s*0\s+(?:\S+\.log(?:\.\d+)?(?:\s+|$))+$'
