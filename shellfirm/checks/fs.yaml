- from: fs
  # Operands are normalized by the parser first (`//` → `/`, `/home/..` → `/`,
  # `~/` → `~`, `${HOME}` → `$HOME`, `./*` → `*`, trailing `/` dropped).
  test: '^rm\s+(?:\S+\s+)*?(?:-[a-zA-Z]*[rRf][a-zA-Z]*|--recursive|--force)\s+(?:\S+\s+)*?(/\*?|~(?:/\*)?|\$HOME(?:/\*)?|\.\.?(?:/\.\.)*(?:/\*)?|\*|\.git(?:/(?:\*|objects|refs|logs|index|HEAD)(?:/\S*)?)?|/(?:home|Users)/[^/\s*]+(?:/\*)?|/System/Volumes/Data(?:/[^\s]*)?|/(?:home|etc|usr|var|bin|sbin|lib|lib64|boot|opt|root|srv|sys|proc|dev|System|Users|Library|Applications)(?:/\*)?)(?:\s|$)'
  description: "This deletes a critical location: the filesystem root, your home directory, a system directory, the repository, or everything in the current directory."
  id: fs:recursively_delete
  severity: Critical
  filters:
    - type: PathExists
      value: 1
  alternative: "trash <path>"
  alternative_info: "Moves to trash instead of permanent deletion. Install: brew install trash (macOS) or trash-cli (Linux)."
- from: fs
  # Credentials and keys in the home directory: losing them locks you out
  # (SSH, GPG, cloud and cluster credentials).
  test: '^(?:rm|unlink|shred|srm)\s+(?:\S+\s+)*?((?:~|\$HOME|/home/[^/\s]+|/Users/[^/\s]+|/root)/\.(?:ssh|gnupg|aws|kube|azure|docker|password-store|config/gcloud)(?:/\S*)?)(?:\s|$)'
  description: "This deletes SSH keys, GPG keys or cloud / cluster credentials from your home directory."
  id: fs:delete_credentials
  severity: Critical
  filters:
    - type: PathExists
      value: 1
  alternative: "trash <path>"
  alternative_info: "Moves to trash instead of permanent deletion, so the keys can be restored."
- from: fs
  # macOS: erasing, zeroing or repartitioning a disk or volume.
  test: '^diskutil\s+(?:\S+\s+)*?(?:eraseDisk|eraseVolume|zeroDisk|randomDisk|secureErase|partitionDisk|reformat|apfs\s+(?:deleteContainer|deleteVolume|eraseVolume|eraseDisk))(?:\s|$)'
  description: "This erases a disk or volume with diskutil: all data on it is lost."
  id: fs:diskutil_erase
  severity: Critical
  filters:
    # `diskutil secureErase freespace <mount>` erases only the free space, not
    # the files on the volume.
    - type: NotMatches
      value: '(?:^|\s)secureErase\s+freespace(?:\s|$)'
- from: fs
  # Output redirected straight onto a block device (`cat /dev/urandom > /dev/sda`),
  # or `tee` / `cp` writing onto one.
  test: '(?:(?:^|\s)\d*>>?\|?\s*|(?:^|\s)tee\s+(?:-\S+\s+)*|(?:^|\s)cp\s+(?:-\S+\s+)*\S+\s+)(/dev/(?:[hsv]d[a-z]+[0-9]*|r?disk[0-9]+(?:s[0-9]+)*|xvd[a-z]+[0-9]*|mmcblk[0-9]+(?:p[0-9]+)?|nvme[0-9]+n[0-9]+(?:p[0-9]+)?|md[0-9]+(?:p[0-9]+)?|dm-[0-9]+|mapper/[^\s/]+|disk/by-[a-z-]+/[^\s/]+))(?:\s|$)'
  description: "This writes straight onto a disk device, overwriting the partition table and file systems on it."
  id: fs:write_to_block_device
  severity: Critical
- from: fs
  # `nvme format` / `nvme sanitize` erase an NVMe device at the controller.
  test: '(?:^|\s)nvme\s+(?:format|sanitize)\s+(?:\S+\s+)*?/dev/(?:nvme[0-9]+(?:n[0-9]+)?(?:p[0-9]+)?|ng[0-9]+n[0-9]+)(?:\s|$)'
  description: "This erases or sanitizes an NVMe device at the controller level: all data on it is lost."
  id: fs:nvme_format
  severity: Critical
- from: fs
  # Windows `cmd`: `rd` / `rmdir` / `del` / `erase` with `/s` (whole tree; also
  # glued, `/s/q`) on a drive root, the profiles folder, one profile or one of
  # its top folders (Documents, Desktop, AppData, .ssh, ...), the Windows
  # directory, or a `%VAR%` naming one of them. The parser adds a `/`-separated
  # reading of lines with Windows paths, so `C:\Users\dev` is seen as `C:/Users/dev`.
  test: '(?i)(?:^|\s)(?:rmdir|rd|del|erase)(?:(?:\s+\S+)*?\s+)?(?:/[a-z])*/s(?:/[a-z])*(?:\s+\S+)*?\s+((?:[a-z]:/?|[a-z]:/Users(?:/[^/\s*]+(?:/(?:Documents|Desktop|Downloads|Pictures|Videos|Music|AppData|OneDrive[^/\s]*|\.ssh))?)?/?|[a-z]:/Windows(?:/System32)?/?|%(?:USERPROFILE|HOMEDRIVE|HOMEPATH|SystemDrive|SystemRoot|windir|APPDATA|LOCALAPPDATA|ProgramData)%(?:%HOMEPATH%)?(?:/(?:Documents|Desktop|Downloads|Pictures|Videos|Music|AppData|OneDrive[^/\s]*|\.ssh))?/?)(?:\*(?:\.\*)?)?)(?:\s|$)|(?:^|\s)(?:rmdir|rd|del|erase)\s+(?:\S+\s+)*?((?:[a-z]:/?|[a-z]:/Users(?:/[^/\s*]+(?:/(?:Documents|Desktop|Downloads|Pictures|Videos|Music|AppData|OneDrive[^/\s]*|\.ssh))?)?/?|[a-z]:/Windows(?:/System32)?/?|%(?:USERPROFILE|HOMEDRIVE|HOMEPATH|SystemDrive|SystemRoot|windir|APPDATA|LOCALAPPDATA|ProgramData)%(?:%HOMEPATH%)?(?:/(?:Documents|Desktop|Downloads|Pictures|Videos|Music|AppData|OneDrive[^/\s]*|\.ssh))?/?)(?:\*(?:\.\*)?)?)\s+(?:\S+\s+)*?(?:/[a-z])*/s(?:/[a-z])*(?:\s|$)'
  description: "This deletes a whole Windows drive, the user profiles or the Windows directory, with every file and folder in it."
  id: fs:windows_recursive_delete
  severity: Critical
- from: fs
  # PowerShell: `Remove-Item -Recurse` (`-r`, `-rec`, `-Recurse:$true`; `ri`,
  # `rm`, `rd`, `rmdir`, `del`, `erase` are aliases) on the same targets,
  # `$env:USERPROFILE` and friends (also `${env:…}`, `-Path:<target>`). `~`
  # only for `Remove-Item` / `ri` (`rm -r ~` is fs:recursively_delete).
  test: '(?i)(?:^|\s)(?:Remove-Item|ri|rm|rmdir|rd|del|erase)\s+(?:\S+\s+)*?-r[a-z]*(?::\$true)?(?:\s+\S+)*?\s+(?:-(?:Path|LiteralPath):)?((?:[a-z]:/?|[a-z]:/Users(?:/[^/\s*]+(?:/(?:Documents|Desktop|Downloads|Pictures|Videos|Music|AppData|OneDrive[^/\s]*|\.ssh))?)?/?|[a-z]:/Windows(?:/System32)?/?|\$\{?env:(?:USERPROFILE|HOMEDRIVE|HOMEPATH|SystemDrive|SystemRoot|windir|APPDATA|LOCALAPPDATA|ProgramData)\}?(?:/(?:Documents|Desktop|Downloads|Pictures|Videos|Music|AppData|OneDrive[^/\s]*|\.ssh))?/?)(?:\*(?:\.\*)?)?)(?:\s|$)|(?:^|\s)(?:Remove-Item|ri|rm|rmdir|rd|del|erase)\s+(?:\S+\s+)*?(?:-(?:Path|LiteralPath):)?((?:[a-z]:/?|[a-z]:/Users(?:/[^/\s*]+(?:/(?:Documents|Desktop|Downloads|Pictures|Videos|Music|AppData|OneDrive[^/\s]*|\.ssh))?)?/?|[a-z]:/Windows(?:/System32)?/?|\$\{?env:(?:USERPROFILE|HOMEDRIVE|HOMEPATH|SystemDrive|SystemRoot|windir|APPDATA|LOCALAPPDATA|ProgramData)\}?(?:/(?:Documents|Desktop|Downloads|Pictures|Videos|Music|AppData|OneDrive[^/\s]*|\.ssh))?/?)(?:\*(?:\.\*)?)?)\s+(?:\S+\s+)*?-r[a-z]*(?::\$true)?(?:\s|$)|(?:^|\s)(?:Remove-Item|ri)\s+(?:\S+\s+)*?-r[a-z]*(?::\$true)?(?:\s+\S+)*?\s+(?:-(?:Path|LiteralPath):)?((?:~|\$HOME|\$\{HOME\})(?:/(?:Documents|Desktop|Downloads|Pictures|Videos|Music|AppData|OneDrive[^/\s]*|\.ssh))?/?(?:\*(?:\.\*)?)?)(?:\s|$)|(?:^|\s)(?:Remove-Item|ri)\s+(?:\S+\s+)*?(?:-(?:Path|LiteralPath):)?((?:~|\$HOME|\$\{HOME\})(?:/(?:Documents|Desktop|Downloads|Pictures|Videos|Music|AppData|OneDrive[^/\s]*|\.ssh))?/?(?:\*(?:\.\*)?)?)\s+(?:\S+\s+)*?-r[a-z]*(?::\$true)?(?:\s|$)'
  description: "This deletes a whole Windows drive, your user profile or the Windows directory, with every file and folder in it."
  id: fs:windows_remove_item_recursive
  severity: Critical
- from: fs
  # PowerShell: everything a listing finds, piped into a delete
  # (`Get-ChildItem C:\ -Recurse | Remove-Item -Force`, `ls ~ | rm -Recurse`).
  test: '(?i)(?:^|\s)(?:Get-ChildItem|gci|dir|ls)[ \t]+(?:[^\s|;&]+[ \t]+)*?(?:-(?:Path|LiteralPath):)?((?:[a-z]:/?|[a-z]:/Users(?:/[^/\s*]+(?:/(?:Documents|Desktop|Downloads|Pictures|Videos|Music|AppData|OneDrive[^/\s]*|\.ssh))?)?/?|[a-z]:/Windows(?:/System32)?/?|\$\{?env:(?:USERPROFILE|HOMEDRIVE|HOMEPATH|SystemDrive|SystemRoot|windir|APPDATA|LOCALAPPDATA|ProgramData)\}?(?:/(?:Documents|Desktop|Downloads|Pictures|Videos|Music|AppData|OneDrive[^/\s]*|\.ssh))?/?)(?:\*(?:\.\*)?)?|(?:~|\$HOME|\$\{HOME\})(?:/(?:Documents|Desktop|Downloads|Pictures|Videos|Music|AppData|OneDrive[^/\s]*|\.ssh))?/?(?:\*(?:\.\*)?)?)(?:[ \t]+[^\s|;&]+)*?[ \t]*\|[ \t]*(?:Remove-Item|ri|rm|rmdir|rd|del|erase)(?:[ \t]+-\S+(?:[ \t]+(?:0|[1-9]|SilentlyContinue|Ignore|Continue|Stop|\$true|\$false))?)*[ \t]*(?:$|[|;\n])'
  description: "This lists a whole Windows drive or your user profile and pipes every item into a delete."
  id: fs:windows_pipeline_delete
  severity: Critical
- from: fs
  # Windows `format D:` (switches before or after the drive) and the
  # PowerShell storage cmdlets that erase a volume or a disk.
  test: '(?i)(?:^|\s)format(?:\.com)?\s+(?:/\S+\s+)*[a-z]:(?:\s|$)|^(?:Format-Volume|Clear-Disk|Initialize-Disk|Remove-Partition|Reset-PhysicalDisk)(?:\s|$)|(?:^|\s)diskpart(?:\.exe)?\s+(?:\S+\s+)*?/s(?:\s|$)'
  description: "This formats a Windows drive or wipes a disk, erasing all data on it."
  id: fs:windows_format_drive
  severity: Critical
- from: fs
  # A direct child of the home directory (`~/projects`, `~/data`) or a
  # directory outside the current one (`../webapp`).
  test: '^rm\s+(?:\S+\s+)*?(?:-[a-zA-Z]*[rR][a-zA-Z]*|--recursive)\s+(?:\S+\s+)*?((?:~|\$HOME|/home/[^/\s]+|/Users/[^/\s]+|/root)/[^/\s*]+|(?:\.\./)+[^/\s.][^\s]*|(?:\.\./)+\.[^/\s.][^\s]*)(?:\s|$)'
  description: "This recursively deletes a top-level folder of your home directory (for example `~/projects` or `~/data`), or a directory outside the current one reached with `../`."
  id: fs:recursively_delete_outside
  severity: High
  filters:
    - type: PathExists
      value: 1
    # Package-manager caches only (`rm -rf /root/.cache` in a Dockerfile).
    - type: NotMatches
      value: '^rm\s+(?:-\S+\s+)*(?:(?:/var/lib/apt/lists|/var/cache/(?:apt|apk|yum|dnf|debconf|pacman/pkg)|/root/\.cache|~/\.cache|\$HOME/\.cache|/root/\.npm/_cacache|/usr/share/doc|/usr/share/man)(?:/\S*)?(?:\s+|$))+$'
    # zsh's completion cache (`rm -rf ~/.zcompdump*`): compinit rebuilds it.
    - type: NotMatches
      value: '^rm\s+(?:-[a-zA-Z]+\s+)*(?:(?:~|\$HOME|\$\{HOME\}|\$ZDOTDIR|\$\{ZDOTDIR(?::-[^}\s]*)?\}|/home/[^/\s]+|/Users/[^/\s]+|/root)/\.zcompdump[^\s/]*(?:\s+|$))+$'
  alternative: "trash <path>"
  alternative_info: "Moves to trash instead of permanent deletion."
- from: fs
  # Emitted by shellfirm when `rm -r` deletes the root of a git repository
  # (a directory with a readable .git), by any spelling (`../webapp`,
  # `~/projects/webapp`, `/srv/app`).
  test: '^shellfirm-delete-repository\s'
  description: "This recursively deletes a whole git repository, including any work that was never pushed."
  id: fs:delete_repository
  severity: High
  alternative: "trash <path>"
  alternative_info: "Moves to trash instead of permanent deletion."
- from: fs
  # Emitted by shellfirm when `rm -r` deletes the `.git` directory of a
  # repository by another spelling than `.git` (`projects/webapp/.git` from
  # the home directory, `../.git` from a sub-directory).
  test: '^shellfirm-delete-git-dir\s'
  description: "This deletes the .git directory of a repository: its whole history, branches, stashes and every commit that was never pushed."
  id: fs:delete_git_dir
  severity: Critical
  alternative: "trash <path>"
  alternative_info: "Moves to trash instead of permanent deletion."
- from: fs
  # Emitted by shellfirm when `mv DIR /tmp/…` moves a folder of a git
  # repository that holds uncommitted or untracked files (or that could not
  # be checked in time) to a scratch folder that is cleared on its own.
  test: '^shellfirm-move-work-away\s'
  description: "This moves a folder with work git does not have to a scratch folder that is cleared on its own."
  id: fs:move_work_away
  severity: High
  alternative: "git stash push --include-untracked -- <path>"
  alternative_info: "Keeps the uncommitted and untracked files in a stash you can bring back with `git stash pop`."
- from: fs
  # Emitted by shellfirm for every `context.sensitive_paths` entry the
  # command deletes or overwrites (see `shellfirm config context paths`).
  test: '^shellfirm-sensitive-path\s'
  description: "This deletes or overwrites a path you marked as sensitive (context.sensitive_paths)."
  id: fs:sensitive_path
  severity: High
- from: fs
  test: (?:^|\s)mv\s+(?:-\S+\s+)*([^-\s]\S*)(?:\s+\S+)*\s+/dev/null(?:\s|$)
  description: "Moving files to /dev/null destroys them."
  id: fs:move_to_dev_null
  severity: Critical
  filters:
    - type: PathExists
      value: 1
- from: fs
  test: (?:^|\s)(?:[0-9]*|&)>\|?\s+(\S+)
  description: "This redirection overwrites the existing file and erases its contents."
  id: fs:flush_file_content
  severity: Medium
  filters:
    - type: PathExists
      value: 1
    - type: NotMatches
      value: '(?:^|\s)(?:[0-9]*|&)>\|?\s+/(?:dev|proc|sys)/'
    # A fresh `mktemp` file, and truncating log files on purpose (`: >
    # app.log`, `for f in *.log; do : > "$f"; done`) are routine.
    - type: NotMatches
      value: '(?:^|\s)(?:[0-9]*|&)>\|?\s+/tmp/shellfirm-mktemp\.\S*(?:\s|$)'
    - type: NotMatches
      value: '^(?::|true)\s+>\|?\s+\S*\.log(?:\.\d+)?(?:\s|$)'
- from: fs
  test: '(?:^|\s)chmod\s+(?:\S+\s+)*(?:-[a-zA-Z]*R[a-zA-Z]*|--recursive)\s+(?:\S+\s+)*(/\*?|~(?:/\*)?|\$HOME(?:/\*)?|\.+|\*|/(?:home|etc|usr|var|bin|sbin|lib|lib64|boot|opt|root|srv|Users|Library|System)(?:/\*)?|/(?:home|Users)/[^/\s]+/?\*?)(?:\s|$)'
  description: "Recursively changing permissions on the root, home or current directory can break the system and SSH keys."
  id: fs:recursively_chmod
  severity: Critical
  filters:
    # Adding your own permissions, adding read access or taking write access
    # away from others (`chmod -R u+rwX .`, `a+r`, `go-w`) on the project or
    # the home directory repairs access; it does not break anything
    # (fs-strict:change_permissions still reports it).
    - type: NotMatches
      value: '^chmod(?:\s+-\S+)*\s+(?:u+\+[rwxXst]+|[ugoa]*\+[rX]+|[go]+-[rwxXst]+)(?:,(?:u+\+[rwxXst]+|[ugoa]*\+[rX]+|[go]+-[rwxXst]+))*(?:\s+-\S+)*(?:\s+(?:\.{1,2}|\*|~|\$HOME|/(?:home|Users)/[^/\s]+)(?:/\S*)?)+$'
    # `chmod -R 755 .` on the project: everything readable, nothing writable
    # by others (fs-strict:change_permissions still reports it, Low).
    - type: NotMatches
      value: '^chmod(?:\s+-\S+)*\s+0?755(?:\s+-\S+)*\s+\.(?:/)?$'
# Opening the SSH / GnuPG keys to other users, or locking them with 000:
# recursively any group / other permission, on a single file any group /
# other write. `chmod -R 700 ~/.ssh`, `go-rwx` and `chmod 644 ~/.ssh/id.pub`
# are the right fix / normal and stay quiet.
- from: fs
  test: '(?:^|\s)chmod\s+(?:(?:-\S+\s+)*(?:-[a-zA-Z]*R[a-zA-Z]*|--recursive)\s+(?:-\S+\s+)*(?:0?[0-7][0-7][1-7]|0?[0-7][1-7][0-7]|0?000|(?:[ugoa]*[goa][ugoa]*)?[+=][rwxXst]+)|(?:-\S+\s+)*(?:0?[0-7][0-7][2367]|0?[0-7][2367][0-7]|0?000|(?:[ugoa]*[goa][ugoa]*)?[+=][rwxXst]*w[rwxXst]*))\s+(?:\S+\s+)*?(?:~|\$HOME|/(?:home|Users)/[^/\s]+)/\.(?:ssh|gnupg)(?:/\S*)?(?:\s|$)'
  description: "This changes the permissions of your SSH or GnuPG keys so that other users can read them (ssh then refuses the keys), or so that nobody can."
  id: fs:chmod_credentials
  severity: High
  alternative: "chmod -R go-rwx ~/.ssh"
  alternative_info: "Keys must be readable only by you: `chmod 700 ~/.ssh` and `chmod 600` for the files in it."

# find -delete: without a name/time/size filter it deletes everything under
# the starting point. find evaluates its expression left to right, so a
# filter only narrows the delete when it comes *before* `-delete`
# (`find . -delete -name '*.log'` deletes everything). A filter on a critical root (`find / -name x -delete`)
# is still critical; a filtered delete elsewhere is Medium.
- from: fs
  test: (?:^|\s)find\s.*\s-delete(\s|$)
  description: "find -delete without a name, time or size filter deletes everything under the path: here the filesystem root, your home directory, a system directory, the repository or the current directory."
  id: fs:delete_find_files
  severity: Critical
  filters:
    - type: NotMatches
      value: '\s-(?:i?name|i?path|i?wholename|i?regex|newer\S*|[ac]newer|[amc](?:time|min)|size|user|group|[ug]id|perm|empty|links|inum|samefile|i?lname|used)\s(?:.*\s)?-delete(?:\s|$)'
    # Starting point: `.`, `..`, `~`, `/`, a system or home directory, `.git`,
    # a glob or a variable. A named subdirectory is fs:delete_find_files_dir.
    - type: Matches
      value: '(?:^|\s)find\s+(?:-[HLP]\s+)*(?:[^-\s(!]\S*\s+)*?(?:/\*?|~(?:/[^/\s]+)?|\$HOME(?:/[^/\s]+)?|\.\.?(?:/\S*)?|\*|\.git(?:/\S*)?|\$\{?\w+\}?\S*|\{\}|/(?:home|Users)/[^/\s]+(?:/[^/\s]+)?|/(?:home|etc|usr|var|bin|sbin|lib|lib64|boot|opt|root|srv|sys|proc|dev|System|Users|Library|Applications)(?:/[^/\s]+)?)(?:\s|$)'
  alternative: "find <path> -name '<pattern>' -print"
  alternative_info: "Preview what would be deleted with -print first, then add -delete when you're sure."
- from: fs
  # `find build -mindepth 1 -delete`, `find dist -type f -delete`: emptying a
  # named directory, like `rm -rf build/*`.
  test: (?:^|\s)find\s.*\s-delete(\s|$)
  description: "find -delete without a name, time or size filter deletes every file under the given directory."
  id: fs:delete_find_files_dir
  severity: Medium
  filters:
    - type: NotMatches
      value: '\s-(?:i?name|i?path|i?wholename|i?regex|newer\S*|[ac]newer|[amc](?:time|min)|size|user|group|[ug]id|perm|empty|links|inum|samefile|i?lname|used)\s(?:.*\s)?-delete(?:\s|$)'
    - type: NotMatches
      value: '(?:^|\s)find\s+(?:-[HLP]\s+)*(?:[^-\s(!]\S*\s+)*?(?:/\*?|~(?:/[^/\s]+)?|\$HOME(?:/[^/\s]+)?|\.\.?(?:/\S*)?|\*|\.git(?:/\S*)?|\$\{?\w+\}?\S*|\{\}|/(?:home|Users)/[^/\s]+(?:/[^/\s]+)?|/(?:home|etc|usr|var|bin|sbin|lib|lib64|boot|opt|root|srv|sys|proc|dev|System|Users|Library|Applications)(?:/[^/\s]+)?)(?:\s|$)'
  alternative: "find <path> -name '<pattern>' -print"
  alternative_info: "Preview what would be deleted with -print first, then add -delete when you're sure."
- from: fs
  test: '^find\s+(?:-[HLP]\s+)*(?:[^-\s(!]\S*\s+)*?(?:/|~|\$HOME|/(?:home|etc|usr|var|bin|sbin|lib|lib64|boot|opt|root|srv|sys|proc|dev|System|Users|Library|Applications))\s(?:.*\s)?-delete(?:\s|$)'
  description: "find -delete under the filesystem root, your home directory or a system directory deletes every matching file there."
  id: fs:delete_find_files_critical_root
  severity: Critical
  filters:
    # The unfiltered form is covered by fs:delete_find_files.
    - type: Matches
      value: '\s-(?:i?name|i?path|i?wholename|i?regex|newer\S*|[ac]newer|[amc](?:time|min)|size|user|group|[ug]id|perm|empty|links|inum|samefile|i?lname|used)\s(?:.*\s)?-delete(?:\s|$)'
  alternative: "find <path> -name '<pattern>' -print"
  alternative_info: "Preview what would be deleted with -print first, then add -delete when you're sure."
- from: fs
  test: (?:^|\s)find\s.*\s-delete(\s|$)
  description: "find -delete permanently deletes every file matching the filter."
  id: fs:delete_find_files_filtered
  severity: Medium
  filters:
    - type: Matches
      value: '\s-(?:i?name|i?path|i?wholename|i?regex|newer\S*|[ac]newer|[amc](?:time|min)|size|user|group|[ug]id|perm|empty|links|inum|samefile|i?lname|used)\s(?:.*\s)?-delete(?:\s|$)'
    # Applies under sudo / doas too (checks.rs PRIVILEGED_MARKER).
    - type: NotMatches
      value: '^(?:shellfirm-privileged\s+)?find\s+(?:-[HLP]\s+)*(?:[^-\s(!]\S*\s+)*?(?:/|~|\$HOME|/(?:home|etc|usr|var|bin|sbin|lib|lib64|boot|opt|root|srv|sys|proc|dev|System|Users|Library|Applications))(?:\s|$)'
    # Clearing caches under the current directory or one folder in it
    # (`find src -name __pycache__ -exec rm -rf {} +`, `find . -name '*.pyc'
    # -delete`, `.DS_Store`): one exact name test, no `-o` / `!` / `(` and
    # nothing else deleted.
    - type: NotMatches
      value: '^find\s+(?:\.|[^-\s.~/$(!*?\[{][^\s/*?\[{$]*)\s+(?:-depth\s+)?(?:-type\s+[df]\s+)?-i?name\s+(?:node_modules|__pycache__|\.mypy_cache|\.ruff_cache|\.pytest_cache|\.turbo|\.parcel-cache|\.next|\.nuxt|\.svelte-kit|\.angular|\.gradle|\.tox|\.nox|\.dart_tool|\.nyc_output|\.venv|\*\.py[co]|\.DS_Store)\s+(?:-type\s+[df]\s+)?(?:-prune\s+)?(?:-depth\s+)?-delete$'
  alternative: "find <path> -name '<pattern>' -print"
  alternative_info: "Preview what would be deleted with -print first, then add -delete when you're sure."
- from: fs
  # Any block device: local (`sda`, `nvme0n1`), cloud (`xvdf`, `vdb`), RAID,
  # device-mapper / LVM (`mapper/vg-data`, `vg/lv`) and stable names
  # (`disk/by-id/…`).
  test: '(?:^|\s)dd\s+(?:\S+\s+)*?of=(/dev/(?:[hsv]d[a-z]+[0-9]*|r?disk[0-9]+(?:s[0-9]+)*|xvd[a-z]+[0-9]*|mmcblk[0-9]+(?:p[0-9]+)?|nvme[0-9]+n[0-9]+(?:p[0-9]+)?|md[0-9]+(?:p[0-9]+)?|md/[^\s/]+|dm-[0-9]+|mapper/[^\s/]+|disk/by-[a-z-]+/[^\s/]+|loop[0-9]+(?:p[0-9]+)?|rbd[0-9]+|zd[0-9]+|[a-zA-Z][\w.-]*/[\w.+-]+))(?:\s|$)'
  description: "Writing directly to a block device can overwrite the whole disk."
  id: fs:dd_block_device
  severity: Critical
  filters:
    # Pseudo files under /dev that are not disks.
    - type: NotMatches
      value: 'of=/dev/(?:fd|pts|shm|tcp|udp|std(?:in|out|err)|mqueue|hugepages|net)/'
- from: fs
  # Any options before the device (`-F`, `-L data`, `-t xfs`) and any block
  # device name (see fs:dd_block_device).
  test: '(?:^|\s)(?:mkfs(?:\.\w+)?|mke2fs|mkswap)\s+(?:\S+\s+)*?(/dev/(?:[hsv]d[a-z]+[0-9]*|r?disk[0-9]+(?:s[0-9]+)*|xvd[a-z]+[0-9]*|mmcblk[0-9]+(?:p[0-9]+)?|nvme[0-9]+n[0-9]+(?:p[0-9]+)?|md[0-9]+(?:p[0-9]+)?|md/[^\s/]+|dm-[0-9]+|mapper/[^\s/]+|disk/by-[a-z-]+/[^\s/]+|loop[0-9]+(?:p[0-9]+)?|rbd[0-9]+|zd[0-9]+|[a-zA-Z][\w.-]*/[\w.+-]+))(?:\s|$)'
  description: "Formatting a device erases all data on it."
  id: fs:mkfs_format
  severity: Critical
  filters:
    # `mkfs.ext4 -n` / `mke2fs -n` / `mkfs.xfs -N`: a dry run that writes nothing.
    - type: NotMatches
      value: '(?:^|\s)(?:mkfs\.ext[2-4]|mke2fs|mkfs\.xfs)\s+(?:\S+\s+)*?-[nN](?:\s|$)'
- from: fs
  test: '(?:^|\s)parted\s+(?:\S+\s+)*?(/dev/(?:[hsv]d[a-z]+[0-9]*|r?disk[0-9]+(?:s[0-9]+)*|xvd[a-z]+[0-9]*|mmcblk[0-9]+(?:p[0-9]+)?|nvme[0-9]+n[0-9]+(?:p[0-9]+)?|md[0-9]+(?:p[0-9]+)?|md/[^\s/]+|dm-[0-9]+|mapper/[^\s/]+|disk/by-[a-z-]+/[^\s/]+|loop[0-9]+(?:p[0-9]+)?|rbd[0-9]+|zd[0-9]+|[a-zA-Z][\w.-]*/[\w.+-]+))(?:\s|$)'
  description: "Modifying disk partitions can erase all data on the disk."
  id: fs:parted_disk_modify
  severity: Critical
  filters:
    # parted runs every command word in order: only `print`, `free` and
    # `unit UNIT` read the table without writing. No command word at all is
    # interactive (commands come from stdin). Its output may only be piped
    # on into commands that show it (`| grep gpt`, `| head`, `tee FILE`).
    - type: NotMatches
      value: '(?:^|\s)parted(?:\s+(?:-s|--script|-m|--machine|-l|--list))*\s+/dev/\S+(?:\s+(?:print|free|unit\s+(?:s|B|kB|MB|MiB|GB|GiB|TB|TiB|%|cyl|chs|compact)))+(?:\s+2>&\s*1)?(?:\s+\|\s+(?:(?:head|tail|grep|egrep|fgrep|less|wc|sort)(?:\s+[^\s|;&<>()$`]+)*|tee(?:\s+-a)?\s+[^-\s|;&<>()$`][^\s|;&<>()$`]*))*(?:\s*$|\s+(?:&&|\|\||;)\s)'
- from: fs
  test: '(?:^|\s)fdisk\s+(?:\S+\s+)*?(/dev/(?:[hsv]d[a-z]+[0-9]*|r?disk[0-9]+(?:s[0-9]+)*|xvd[a-z]+[0-9]*|mmcblk[0-9]+(?:p[0-9]+)?|nvme[0-9]+n[0-9]+(?:p[0-9]+)?|md[0-9]+(?:p[0-9]+)?|md/[^\s/]+|dm-[0-9]+|mapper/[^\s/]+|disk/by-[a-z-]+/[^\s/]+|loop[0-9]+(?:p[0-9]+)?|rbd[0-9]+|zd[0-9]+|[a-zA-Z][\w.-]*/[\w.+-]+))(?:\s|$)'
  description: "Modifying disk partitions can erase all data on the disk."
  id: fs:fdisk_disk_modify
  severity: Critical
- from: fs
  test: '(?:^|\s)sfdisk\s+(?:\S+\s+)*?(/dev/(?:[hsv]d[a-z]+[0-9]*|r?disk[0-9]+(?:s[0-9]+)*|xvd[a-z]+[0-9]*|mmcblk[0-9]+(?:p[0-9]+)?|nvme[0-9]+n[0-9]+(?:p[0-9]+)?|md[0-9]+(?:p[0-9]+)?|md/[^\s/]+|dm-[0-9]+|mapper/[^\s/]+|disk/by-[a-z-]+/[^\s/]+|loop[0-9]+(?:p[0-9]+)?|rbd[0-9]+|zd[0-9]+|[a-zA-Z][\w.-]*/[\w.+-]+))(?:\s|$)'
  description: "Modifying disk partitions can erase all data on the disk."
  id: fs:sfdisk_disk_modify
  severity: Critical
- from: fs
  test: '(?:^|\s)dd\s+.*(?:conv=notrunc|seek=\d+|skip=\d+).*of=(/dev/(?:[hsv]d[a-z]+[0-9]*|r?disk[0-9]+(?:s[0-9]+)*|xvd[a-z]+[0-9]*|mmcblk[0-9]+(?:p[0-9]+)?|nvme[0-9]+n[0-9]+(?:p[0-9]+)?|md[0-9]+(?:p[0-9]+)?|md/[^\s/]+|dm-[0-9]+|mapper/[^\s/]+|disk/by-[a-z-]+/[^\s/]+|loop[0-9]+(?:p[0-9]+)?|rbd[0-9]+|zd[0-9]+|[a-zA-Z][\w.-]*/[\w.+-]+))(?:\s|$)'
  description: "Writing to a specific disk sector can corrupt data."
  id: fs:dd_advanced_disk_write
  severity: Critical
- from: fs
  test: '(?:^|\s)gdisk\s+(?:\S+\s+)*?(/dev/(?:[hsv]d[a-z]+[0-9]*|r?disk[0-9]+(?:s[0-9]+)*|xvd[a-z]+[0-9]*|mmcblk[0-9]+(?:p[0-9]+)?|nvme[0-9]+n[0-9]+(?:p[0-9]+)?|md[0-9]+(?:p[0-9]+)?|md/[^\s/]+|dm-[0-9]+|mapper/[^\s/]+|disk/by-[a-z-]+/[^\s/]+|loop[0-9]+(?:p[0-9]+)?|rbd[0-9]+|zd[0-9]+|[a-zA-Z][\w.-]*/[\w.+-]+))(?:\s|$)'
  description: "Modifying GPT disk partitions can erase all data on the disk."
  id: fs:gdisk_disk_modify
  severity: Critical
- from: fs
  # `sgdisk --zap-all` / `-Z` destroys the GPT and MBR, `-z` / `--zap` the
  # GPT, `-o` / `--clear` writes a new empty partition table.
  test: '(?:^|\s)sgdisk\s+(?:\S+\s+)*?(?:--zap-all|--zap|--clear|-[a-zA-Z]*[Zzo][a-zA-Z]*)(?:\s|$)'
  description: "This destroys the partition table of the disk (with --zap-all also the MBR); every partition on it becomes unreachable."
  id: fs:sgdisk_zap
  severity: Critical
  alternative: "sgdisk --print <device>"
  alternative_info: "Print the partition table first and back it up with `sgdisk --backup=<file> <device>`."
- from: fs
  test: '(?:^|\s)blkdiscard\s+(?:\S+\s+)*?(/dev/(?:[hsv]d[a-z]+[0-9]*|r?disk[0-9]+(?:s[0-9]+)*|xvd[a-z]+[0-9]*|mmcblk[0-9]+(?:p[0-9]+)?|nvme[0-9]+n[0-9]+(?:p[0-9]+)?|md[0-9]+(?:p[0-9]+)?|md/[^\s/]+|dm-[0-9]+|mapper/[^\s/]+|disk/by-[a-z-]+/[^\s/]+|loop[0-9]+(?:p[0-9]+)?|rbd[0-9]+|zd[0-9]+|[a-zA-Z][\w.-]*/[\w.+-]+))(?:\s|$)'
  description: "This discards every block of the device (TRIM): the data on it is gone at once and cannot be recovered."
  id: fs:blkdiscard
  severity: Critical
  alternative: "lsblk -f <device>"
  alternative_info: "Check which filesystem and mount point the device has first."
- from: fs
  test: '(?:^|\s)mdadm\s+(?:\S+\s+)*?--zero-superblock(?:\s|$)'
  description: "This erases the RAID superblock of the device: the array it belongs to can no longer be assembled from it."
  id: fs:mdadm_zero_superblock
  severity: Critical
  alternative: "mdadm --examine <device>"
  alternative_info: "Check which array the device belongs to first."
- from: fs
  test: '(?:^|\s)partprobe\s+.*(/dev/([hs]d[a-z]|mmcblk[0-9]|nvme[0-9]+n[0-9]+))'
  description: "Re-reading the partition table can affect mounted partitions."
  id: fs:partprobe_disk_update
  severity: High
- from: fs
  test: '(?:^|\s)blockdev\s+.*(/dev/([hs]d[a-z]|mmcblk[0-9]|nvme[0-9]+n[0-9]+))'
  description: "Changing block device parameters can affect disk operations."
  id: fs:blockdev_disk_modify
  severity: High
- from: fs
  test: '(?:^|\s)mount\s+.*(/dev/([hs]d[a-z]|mmcblk[0-9]|nvme[0-9]+n[0-9]+))'
  description: "Mounting a raw block device can affect system stability."
  id: fs:mount_operations
  severity: High
- from: fs
  test: '(?:^|\s)(?:sudo\s+)?(?:lvremove|pvremove|vgremove|lvreduce)\s+(?:-[a-zA-Z]+\s+)?(?:--[a-zA-Z-]+\s+)?(?:/dev/(?:[hs]d[a-z]|mmcblk[0-9])|/dev/mapper/[^\s]+|[^\s]+)'
  description: "Removing a logical volume, physical volume or volume group, or shrinking a logical volume, deletes its data."
  id: fs:lvm_operations
  severity: Critical
  filters:
    # Test mode (`-t` / `--test`) changes no metadata. Every option must be
    # one that takes no value (`--config` / `--select` can turn it off).
    - type: NotMatches
      value: '^(?:lvremove|vgremove|pvremove)(?:\s+(?:--verbose|--force|--yes|--quiet|-[vfyq]+|[^-\s]\S*))*\s+(?:--test|-[vfyq]*t[tvfyq]*)(?:\s+(?:--test|--verbose|--force|--yes|--quiet|-[tvfyq]+|[^-\s]\S*))*$'
- from: fs
  test: '(?:^|\s)(?:dump|restore)\s+.*(/dev/([hs]d[a-z]|mmcblk[0-9]|nvme[0-9]+n[0-9]+))'
  description: "Dumping or restoring a raw filesystem device can affect system stability."
  id: fs:filesystem_backup
  severity: High
- from: fs
  test: '(?:^|\s)cryptsetup\s+.*(/dev/([hs]d[a-z]|mmcblk[0-9]|nvme[0-9]+n[0-9]+))'
  description: "Encrypting or reformatting a device with cryptsetup can make its data inaccessible."
  id: fs:encryption_operations
  severity: Critical
  filters:
    # `luksDump` / `isLuks` only read the LUKS header (no key-dump or key
    # options).
    - type: NotMatches
      value: '^cryptsetup(?:\s+(?:-v|--verbose|--debug))*\s+(?:isLuks(?:\s+(?:-v|--verbose|--debug))*\s+[^-\s]\S*(?:\s+(?:-v|--verbose|--debug))*|luksDump(?:\s+(?:-v|--verbose|--debug|--dump-json-metadata))*\s+[^-\s]\S*(?:\s+(?:-v|--verbose|--debug|--dump-json-metadata))*)$'
- from: fs
  test: (?:^|\s)chmod\s
  description: "This changes file permissions."
  id: fs-strict:change_permissions
  severity: Low
  filters:
    # Making one file executable or giving it the usual mode (`chmod +x
    # deploy.sh`, `chmod u+x run`, `chmod 644 notes.txt`) is routine: no
    # prompt for a single file outside the system directories, your home
    # itself and dot directories (`~/.ssh`).
    # Applies under sudo / doas too (checks.rs PRIVILEGED_MARKER).
    - type: NotMatches
      value: '^(?:shellfirm-privileged\s+)?chmod\s+(?:[ugoa]*\+[rx]+|u[+=][rwx]+|0?(?:644|755|600|700|640|750))\s+(?:(?:\./)?[^\s/~$.*\-][^\s*]*|(?:~|\$HOME|/tmp)/[^.\s*][^\s*]*)$'
    # Taking write access away from group / others (`chmod go-w f`, the
    # oh-my-zsh `compaudit | xargs chmod g-w,o-w` fix) only tightens
    # permissions. A recursive change on / or a system directory is still
    # fs:recursively_chmod.
    - type: NotMatches
      value: '(?:^|\s)chmod(?:\s+-\S+)*\s+[go]+-w+(?:,[go]+-w+)*(?:\s|$)'
    # Making one project dotfile owner-only (`chmod 600 .env`) only takes
    # access away. A folder or symbolic link (`.git`) is spelled with a
    # trailing `/` (checks.rs), so it is not skipped.
    - type: NotMatches
      value: '^chmod\s+(?:0?600|0?400|go-rwx|og-rwx)\s+\.[^\s/*?\[{$.~][^\s/*?\[{$]*$'
- from: fs
  test: ^rm\s+(.+)$
  description: "This permanently deletes the given files."
  id: fs-strict:any_deletion
  severity: Low
  filters:
    - type: PathExists
      value: 1
    # Recursive deletes are covered by fs-strict:recursive_deletion.
    - type: NotMatches
      value: '\s(?:-[a-zA-Z]*[rR][a-zA-Z]*|--recursive)(?:\s|$)'
    # Lockfiles and tool caches the next install or build recreates
    # (`rm yarn.lock`, `.eslintcache`, `*.tsbuildinfo`): relative, without
    # `..`, globs or variables.
    - type: NotMatches
      value: '^rm\s+(?:-[a-zA-Z]+\s+)*(?:(?:(?:[^\s/*?\[{$.~]|\.[^\s/*?\[{$.])[^\s/*?\[{$]*/)*(?:package-lock\.json|yarn\.lock|pnpm-lock\.yaml|bun\.lockb?|\.eslintcache|(?:(?:[^\s/*?\[{$.~]|\.[^\s/*?\[{$.])[^\s/*?\[{$]*)?\.tsbuildinfo)(?:\s+|$))+$'
    # zsh's completion cache (`rm -f ~/.zcompdump*`): compinit rebuilds it.
    # Applies under sudo / doas too (checks.rs PRIVILEGED_MARKER).
    - type: NotMatches
      value: '^(?:shellfirm-privileged\s+)?rm\s+(?:-[a-zA-Z]+\s+)*(?:(?:~|\$HOME|\$\{HOME\}|\$ZDOTDIR|\$\{ZDOTDIR(?::-[^}\s]*)?\}|/home/[^/\s]+|/Users/[^/\s]+|/root)/\.zcompdump[^\s/]*(?:\s+|$))+$'
- from: fs
  test: '^rm\s+((?:\S+\s+)*?(?:-[a-zA-Z]*[rR][a-zA-Z]*|--recursive)(?:\s.*)?)$'
  description: "This recursively deletes the given files or directories, with everything inside them."
  id: fs-strict:recursive_deletion
  severity: Medium
  filters:
    - type: PathExists
      value: 1
    # Package-manager caches (the Dockerfile `rm -rf /var/lib/apt/lists/*`
    # idiom), a `.cache` directory and top-level named entries of /tmp: only
    # regenerable / throwaway files, when every operand is one of them.
    # Applies under sudo / doas too (checks.rs PRIVILEGED_MARKER).
    - type: NotMatches
      value: '^(?:shellfirm-privileged\s+)?rm\s+(?:-\S+\s+)*(?:(?:(?:(?:\./)?\.cache|/var/lib/apt/lists|/var/cache/(?:apt|apk|yum|dnf|debconf|pacman/pkg)|/root/\.cache|~/\.cache|\$HOME/\.cache|/root/\.npm/_cacache|/usr/share/doc|/usr/share/man)(?:/\S*)?|/tmp/[^\s/*?]+|/var/tmp/[^\s/*?]+)(?:\s+|$))+$'
    # zsh's completion cache (`rm -rf ~/.zcompdump*`): compinit rebuilds it.
    # Applies under sudo / doas too (checks.rs PRIVILEGED_MARKER).
    - type: NotMatches
      value: '^(?:shellfirm-privileged\s+)?rm\s+(?:-[a-zA-Z]+\s+)*(?:(?:~|\$HOME|\$\{HOME\}|\$ZDOTDIR|\$\{ZDOTDIR(?::-[^}\s]*)?\}|/home/[^/\s]+|/Users/[^/\s]+|/root)/\.zcompdump[^\s/]*(?:\s+|$))+$'
    # A project's dependency / tool caches (`rm -rf node_modules`,
    # `__pycache__`, `.mypy_cache`, `node_modules/.vite`, with
    # `package-lock.json` / `yarn.lock` / `pnpm-lock.yaml` / `bun.lock(b)`
    # beside them): a reinstall or the next run rebuilds them. Every operand
    # is one of them, relative (or under `~/` after a `cd`), without `..`,
    # globs, variables or a trailing `/`. Build output folders (`.next`,
    # `.venv`, `.tox`, `.gradle`, ...) count only as relative paths
    # (`~/.gradle` holds credentials). A symbolic link on the way is spelled
    # with a trailing `/` (checks.rs), so it is not skipped.
    - type: NotMatches
      value: '^rm\s+(?:-\S+\s+)*(?:(?:(?:(?:[^\s/*?\[{$.~]|\.[^\s/*?\[{$.])[^\s/*?\[{$]*/)*|~/(?:[^\s/*?\[{$.][^\s/*?\[{$]*/)*)(?:package-lock\.json|yarn\.lock|pnpm-lock\.yaml|bun\.lockb?)\s+)*(?:(?:(?:[^\s/*?\[{$.~]|\.[^\s/*?\[{$.])[^\s/*?\[{$]*/)*(?:node_modules|__pycache__|\.mypy_cache|\.ruff_cache|\.pytest_cache|\.turbo|\.parcel-cache|\.next|\.nuxt|\.svelte-kit|\.angular|\.gradle|\.tox|\.nox|\.dart_tool|\.nyc_output|\.venv)|node_modules(?:/(?:[^\s/*?\[{$.~]|\.[^\s/*?\[{$.])[^\s/*?\[{$]*)+|~/(?:[^\s/*?\[{$.][^\s/*?\[{$]*/)*(?:(?:node_modules|__pycache__|\.mypy_cache|\.ruff_cache|\.pytest_cache|\.turbo|\.parcel-cache)|node_modules(?:/(?:[^\s/*?\[{$.~]|\.[^\s/*?\[{$.])[^\s/*?\[{$]*)+))(?:\s+(?:(?:(?:(?:[^\s/*?\[{$.~]|\.[^\s/*?\[{$.])[^\s/*?\[{$]*/)*(?:node_modules|__pycache__|\.mypy_cache|\.ruff_cache|\.pytest_cache|\.turbo|\.parcel-cache|\.next|\.nuxt|\.svelte-kit|\.angular|\.gradle|\.tox|\.nox|\.dart_tool|\.nyc_output|\.venv)|node_modules(?:/(?:[^\s/*?\[{$.~]|\.[^\s/*?\[{$.])[^\s/*?\[{$]*)+|~/(?:[^\s/*?\[{$.][^\s/*?\[{$]*/)*(?:(?:node_modules|__pycache__|\.mypy_cache|\.ruff_cache|\.pytest_cache|\.turbo|\.parcel-cache)|node_modules(?:/(?:[^\s/*?\[{$.~]|\.[^\s/*?\[{$.])[^\s/*?\[{$]*)+))|(?:(?:(?:[^\s/*?\[{$.~]|\.[^\s/*?\[{$.])[^\s/*?\[{$]*/)*|~/(?:[^\s/*?\[{$.][^\s/*?\[{$]*/)*)(?:package-lock\.json|yarn\.lock|pnpm-lock\.yaml|bun\.lockb?)))*$'
  alternative: "trash <path>"
  alternative_info: "Moves to trash instead of permanent deletion."
- from: fs
  test: (?:^|\s)rmdir\s+(.*)\s*
  description: "This deletes the given directory."
  id: fs-strict:folder_deletion
  severity: Medium
  filters:
    - type: PathExists
      value: 1
- from: fs
  test: (?:^|\s)rsync\s+.*--delete(\s|$)
  description: "Syncs with deletion — removes files at destination not present in source."
  id: fs:rsync_delete
  severity: High
  alternative: "rsync --dry-run --delete ..."
  alternative_info: "Preview what would be deleted with --dry-run first."
  filters:
    # A real `-n` / `--dry-run` option word before any `--` (not a `-n`
    # inside a path, an option value or the quoted `-e` command), and no
    # later dry-run word. The word before it must not be an option that takes
    # a value (`--exclude -avn`, `-T -n`), and `n` must not follow a short
