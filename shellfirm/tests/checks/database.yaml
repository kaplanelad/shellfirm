  expect_ids: ["database:cqlsh_drop", "database:truncate_table"]
- test: 'cqlsh -e "SELECT * FROM ks.events LIMIT 10"'
  description: "negative: cqlsh select"
  expect_ids: []
- test: 'clickhouse-client --query="DROP DATABASE prod"'
  description: "clickhouse --query= form"
  expect_ids: ["database:clickhouse_drop", "database:drop_database"]
- test: 'clickhouse-client --query="SELECT count() FROM hits"'
  description: "negative: clickhouse select"
  expect_ids: []
- test: 'ALTER TABLE users DROP INDEX idx_email'
  description: "mysql alter table drop index"
  expect_ids: ["database:alter_drop_index"]
- test: 'ALTER TABLE `users` ADD COLUMN x INT, DROP KEY idx_email'
  description: "drop key in a multi-clause alter"
  expect_ids: ["database:alter_drop_index"]
- test: 'ALTER TABLE users ADD INDEX idx_email (email)'
  description: "negative: add index"
  expect_ids: []
- test: 'ALTER TABLE users DROP PRIMARY KEY'
  description: "drop primary key"
  expect_ids: ["database:alter_drop_key"]
- test: 'ALTER TABLE orders DROP FOREIGN KEY fk_user'
  description: "drop foreign key"
  expect_ids: ["database:alter_drop_key"]
