# -- database:delete_all_rows --
- test: "mysql -e \"DELETE IGNORE FROM users\""
  description: "MySQL DELETE IGNORE without WHERE"
  expect_ids: ["database:delete_all_rows"]
- test: "mysql -e \"DELETE LOW_PRIORITY FROM users\""
  description: "MySQL DELETE LOW_PRIORITY without WHERE"
  expect_ids: ["database:delete_all_rows"]
- test: "mysql -e \"DELETE LOW_PRIORITY QUICK IGNORE FROM users\""
  description: "all three modifiers"
  expect_ids: ["database:delete_all_rows"]
- test: "mysql -e \"DELETE IGNORE QUICK FROM users\""
  description: "modifiers in any order"
  expect_ids: ["database:delete_all_rows"]
- test: "mysql -e \"DELETE u FROM users u\""
  description: "multi-table form without WHERE"
  expect_ids: ["database:delete_all_rows"]
- test: "mysql -e \"DELETE u.* FROM users AS u\""
  description: "multi-table form with alias.*"
  expect_ids: ["database:delete_all_rows"]
- test: "mysql -e \"DELETE a, b FROM a, b\""
  description: "multi-table delete of two tables, no WHERE"
  expect_ids: ["database:delete_all_rows"]
- test: "mysql -e \"DELETE t FROM t LEFT JOIN u ON t.id = u.tid\""
  description: "a LEFT JOIN does not filter the target rows"
  expect_ids: ["database:delete_all_rows"]
- test: "mysql -e \"DELETE IGNORE t FROM t\""
  description: "modifier plus multi-table form"
  expect_ids: ["database:delete_all_rows"]
- test: "mysql -e \"DELETE IGNORE FROM users WHERE 1=1\""
  description: "always-true WHERE with a modifier"
  expect_ids: ["database:delete_all_rows"]
- test: "mysql -e \"DELETE t FROM t JOIN u ON t.id = u.tid\""
  description: "an inner JOIN ... ON filters the rows"
  expect_ids: []
- test: "mysql -e \"DELETE t FROM t LEFT JOIN u ON t.id = u.tid WHERE u.id IS NULL\""
  description: "anti-join with a WHERE"
  expect_ids: []
- test: "mysql -e \"DELETE u FROM users u WHERE u.id = 3\""
  description: "multi-table form with a WHERE"
  expect_ids: []
- test: "mysql -e \"DELETE IGNORE FROM users WHERE id = 3\""
  description: "modifier with a real WHERE"
  expect_ids: []
