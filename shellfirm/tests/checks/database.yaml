  description: "negative: merge update"
  expect_ids: []
# -- round 5 (Dana r4 N4, N11, F5, F7) --
- test: 'psql -c "DELETE FROM users WHERE ''a''=''a''"'
  description: "tautology 'a'='a' (string literals are masked) is no WHERE"
  expect_ids: ["database:delete_all_rows"]
- test: 'psql -c "DELETE FROM users WHERE ''a'' = ''a''"'
  description: "tautology with spaces"
  expect_ids: ["database:delete_all_rows"]
- test: 'DELETE FROM users WHERE id IS NOT NULL'
  description: "id IS NOT NULL is every row"
  expect_ids: ["database:delete_all_rows"]
- test: 'DELETE FROM sessions WHERE expired_at IS NOT NULL'
  description: "negative: IS NOT NULL on another column is a real condition"
  expect_ids: []
- test: 'DELETE FROM users WHERE 1'
  description: "WHERE 1 is always true"
  expect_ids: ["database:delete_all_rows"]
- test: 'DELETE FROM users USING orders'
  description: "DELETE ... USING without WHERE"
  expect_ids: ["database:delete_all_rows"]
- test: 'DELETE FROM users u USING orders o WHERE u.id = o.user_id'
  description: "negative: DELETE ... USING with a join condition"
  expect_ids: []
- test: 'UPDATE users SET a = lower(b) WHERE id = 42'
  description: "negative: function call with arguments in SET"
  expect_ids: []
- test: 'UPDATE users SET a = 1 WHERE id IS NOT NULL'
  description: "UPDATE with an always-true WHERE"
  expect_ids: ["database:update_all_rows"]
- test: 'UPDATE users SET a = 1 WHERE 1'
  description: "UPDATE ... WHERE 1"
  expect_ids: ["database:update_all_rows"]
- test: 'UPDATE users SET active=false WHERE true'
  description: "UPDATE ... WHERE true"
  expect_ids: ["database:update_all_rows"]
- test: 'UPDATE users SET active=false WHERE trust_level = 3'
  description: "negative: real WHERE starting with true"
  expect_ids: []
- test: 'UPDATE users SET a = 1 -- WHERE id = 1'
  description: "a WHERE inside a comment does not count"
  expect_ids: ["database:update_all_rows"]
- test: 'UPDATE users SET a = 1 RETURNING id'
  description: "UPDATE ... RETURNING without WHERE"
  expect_ids: ["database:update_all_rows"]
- test: 'UPDATE users SET wherever = 1'
  description: "a column whose name starts with where is not a WHERE clause"
  expect_ids: ["database:update_all_rows"]
- test: 'UPDATE Users SET A = 1 WHERE Id = 2'
  description: "negative: mixed case WHERE"
  expect_ids: []
- test: 'clickhouse-client -q "ALTER TABLE events DELETE WHERE 1"'
  description: "ClickHouse mutation deleting every row"
  expect_ids: ["database:alter_delete_all"]
- test: 'clickhouse-client -q "ALTER TABLE events ON CLUSTER main DELETE WHERE 1 = 1"'
  description: "ClickHouse mutation on a cluster deleting every row"
  expect_ids: ["database:alter_delete_all"]
- test: 'clickhouse-client -q "ALTER TABLE events DELETE WHERE user_id = 7"'
  description: "negative: ClickHouse mutation with a real condition"
  expect_ids: []
- test: 'cockroach sql -e "DROP DATABASE prod"'
  description: "cockroach sql -e DROP DATABASE"
  expect_ids: ["database:cockroach_drop", "database:drop_database"]
- test: 'cockroach sql --url postgres://x --execute="TRUNCATE orders"'
  description: "cockroach sql --execute= TRUNCATE"
  expect_ids: ["database:cockroach_drop", "database:truncate_table"]
- test: 'cockroach sql -e "SELECT 1"'
  description: "negative: cockroach query"
  expect_ids: []
- test: 'psql -f /home/dev/cleanup.sql'
  description: "psql -f runs SQL the shell-level checks cannot see"
  expect_ids: ["database:sql_from_file"]
- test: 'psql -d prod --file=cleanup.sql'
  description: "psql --file="
  expect_ids: ["database:sql_from_file"]
- test: 'psql -1 -X -f migrate.sql prod'
  description: "psql flags before -f"
  expect_ids: ["database:sql_from_file"]
- test: 'psql prod < cleanup.sql'
  description: "psql reading a file on stdin"
  expect_ids: ["database:sql_from_file"]
- test: 'mysql prod < /backup/dump.sql'
  description: "mysql reading a file on stdin"
  expect_ids: ["database:sql_from_file"]
- test: 'cat cleanup.sql | psql prod'
  description: "a file piped into psql"
  expect_ids: ["database:sql_from_file"]
- test: 'sqlite3 app.db ".read cleanup.sql"'
  description: "sqlite3 .read"
  expect_ids: ["database:sql_from_file"]
- test: 'mysql -e "source cleanup.sql"'
  description: "mysql -e source"
  expect_ids: ["database:sql_from_file"]
- test: 'psql -f -'
  description: "negative: psql -f - reads stdin (checked where it comes from)"
  expect_ids: []
- test: 'psql -c "SELECT count(*) FROM t WHERE a < b"'
  description: "negative: a comparison is not a redirect"
  expect_ids: []
- test: 'psql -c "SELECT 1" < /dev/null'
  description: "negative: stdin from /dev/null"
  expect_ids: []
- test: 'pg_dump prod -f backup.sql'
  description: "negative: pg_dump writes a file"
  expect_ids: []

