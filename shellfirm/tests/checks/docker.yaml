  description: "issue #189: podman system reset -f"
  expect_ids: ["docker:podman_system_reset"]
- test: "podman ps -a"
  description: "negative (issue #189): podman ps -a"
  expect_ids: []
# -- issue #189: podman parity --
- test: "podman volume prune -f"
  description: "podman volume prune"
  expect_ids: ["docker:volume_prune"]
- test: "podman system prune -a"
  description: "podman system prune -a"
  expect_ids: ["docker:system_prune_all"]

# -- docker compose --dry-run (the last dry-run word, not an option's value) --
- test: "docker compose down -v --dry-run"
  description: "negative: a compose dry run changes nothing"
  expect_ids: []
- test: "docker compose --dry-run down -v"
  description: "negative: a compose dry run changes nothing"
  expect_ids: []
- test: "docker compose down --volumes --dry-run"
  description: "negative: a compose dry run changes nothing"
  expect_ids: []
- test: "docker compose down -v --remove-orphans --dry-run"
  description: "negative: a compose dry run changes nothing"
  expect_ids: []
- test: "docker compose --dry-run down --volumes"
  description: "negative: a compose dry run changes nothing"
  expect_ids: []
- test: "docker compose --dry-run rm -fsv"
  description: "negative: a compose dry run changes nothing"
  expect_ids: []
- test: "docker compose down -v"
  description: "still a real run: no effective dry-run flag"
  expect_ids: ["docker:compose_down_volumes"]
- test: "docker compose down --volumes"
  description: "still a real run: no effective dry-run flag"
  expect_ids: ["docker:compose_down_volumes"]
- test: "docker compose down -v --dry-run=false"
  description: "still a real run: no effective dry-run flag"
  expect_ids: ["docker:compose_down_volumes"]
- test: "docker compose down -v --dry-run --dry-run=false"
  description: "still a real run: no effective dry-run flag"
  expect_ids: ["docker:compose_down_volumes"]
- test: "docker compose --dry-run=false down -v"
  description: "still a real run: no effective dry-run flag"
  expect_ids: ["docker:compose_down_volumes"]
- test: "docker compose down -v -t --dry-run"
  description: "still a real run: no effective dry-run flag"
  expect_ids: ["docker:compose_down_volumes"]
- test: "docker compose down -v --timeout --dry-run"
  description: "still a real run: no effective dry-run flag"
  expect_ids: ["docker:compose_down_volumes"]
- test: "docker compose -f --dry-run down -v"
  description: "still a real run: no effective dry-run flag"
  expect_ids: ["docker:compose_down_volumes"]
- test: "docker compose -p --dry-run down -v"
  description: "still a real run: no effective dry-run flag"
  expect_ids: ["docker:compose_down_volumes"]
- test: "docker compose down -v '--dry-run'"
  description: "still a real run: no effective dry-run flag"
  expect_ids: ["docker:compose_down_volumes"]
- test: "docker compose down -v --dry-run && docker compose down -v"
  description: "still a real run: no effective dry-run flag"
  expect_ids: ["docker:compose_down_volumes"]
- test: "docker compose down -v --dry-run; docker compose down -v"
  description: "still a real run: no effective dry-run flag"
  expect_ids: ["docker:compose_down_volumes"]
- test: "docker-compose down -v --dry-run"
  description: "still a real run: no effective dry-run flag"
  expect_ids: ["docker:compose_down_volumes"]
- test: "sudo docker compose down -v"
  description: "still a real run: no effective dry-run flag"
  expect_ids: ["docker:compose_down_volumes"]
- test: "echo docker compose down -v | sh"
  description: "still a real run: no effective dry-run flag"
  expect_ids: ["docker:compose_down_volumes"]
- test: "docker compose down --rmi --dry-run -v"
  description: "still a real run: no effective dry-run flag"
  expect_ids: ["docker:compose_down_volumes"]

# -- docker:compose_rm_volumes --
- test: "docker compose rm -f"
  description: "negative: no anonymous volumes are removed"
  expect_ids: []
- test: "docker compose rm -fs web"
  description: "negative: no anonymous volumes are removed"
  expect_ids: []
- test: "docker compose run --rm -v ./data:/data app"
  description: "negative: no anonymous volumes are removed"
  expect_ids: []
- test: "docker compose ps -v"
  description: "negative: no anonymous volumes are removed"
  expect_ids: []
- test: "docker compose rm -fsv"
  description: "removing the anonymous volumes deletes their data"
  expect_ids: ["docker:compose_rm_volumes"]
- test: "docker compose rm -v -f"
  description: "removing the anonymous volumes deletes their data"
  expect_ids: ["docker:compose_rm_volumes"]
- test: "docker-compose rm -fsv"
  description: "removing the anonymous volumes deletes their data"
  expect_ids: ["docker:compose_rm_volumes"]
- test: "docker compose rm --volumes web"
  description: "removing the anonymous volumes deletes their data"
  expect_ids: ["docker:compose_rm_volumes"]
- test: "docker compose -f prod.yml rm -sv"
  description: "removing the anonymous volumes deletes their data"
  expect_ids: ["docker:compose_rm_volumes"]
- test: "docker compose rm -f -v db"
  description: "removing the anonymous volumes deletes their data"
  expect_ids: ["docker:compose_rm_volumes"]
