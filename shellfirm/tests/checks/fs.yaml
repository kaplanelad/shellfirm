# -- command position: an exemption holds only for a command in command position, run locally as the user --
- test: "alias s=sudo; s rm -rf node_modules && npm install"
  description: "flag: the exempt command is not in command position (a runner, name or expansion in front)"
  expect_ids: ["fs-strict:recursive_deletion"]
- test: "SUDO=sudo; $SUDO rm -rf node_modules && npm install"
  description: "flag: the exempt command is not in command position (a runner, name or expansion in front)"
  expect_ids: ["fs-strict:recursive_deletion"]
- test: "\"${SUDO:-sudo}\" rm -rf node_modules && npm install"
  description: "flag: the exempt command is not in command position (a runner, name or expansion in front)"
  expect_ids: ["fs-strict:recursive_deletion"]
