# -- disks under every block-device name, with any mkfs option --
- test: "mkfs -t xfs /dev/xvdf"
  description: "AWS EBS device name"
  expect_ids: ["fs:mkfs_format"]
- test: "mkfs.ext4 /dev/vdb"
  description: "KVM / OpenStack / DigitalOcean device name"
  expect_ids: ["fs:mkfs_format"]
- test: "mkfs.ext4 -F /dev/sdb"
  description: "an option other than -t before the device"
  expect_ids: ["fs:mkfs_format"]
- test: "mkfs.ext4 -L data /dev/nvme1n1"
  description: "an option with a value before the device"
  expect_ids: ["fs:mkfs_format"]
- test: "mkfs.xfs /dev/mapper/vg-data"
  description: "device-mapper / LVM name"
  expect_ids: ["fs:mkfs_format"]
- test: "mkfs.ext4 /dev/disk/by-id/nvme-Amazon_Elastic_Block_Store_vol0abc"
  description: "stable by-id name"
  expect_ids: ["fs:mkfs_format"]
- test: "mkfs.ext4 /dev/vg0/data"
  description: "LVM volume group / logical volume path"
  expect_ids: ["fs:mkfs_format"]
- test: "mke2fs -t ext4 /dev/md0"
  description: "mke2fs on a RAID device"
  expect_ids: ["fs:mkfs_format"]
- test: "mkfs.ext4 image.img"
  description: "negative: formatting an image file"
  expect_ids: []
- test: "mkfs.ext4 --help"
  description: "negative: no device"
  expect_ids: []
- test: "dd if=/dev/zero of=/dev/xvdf bs=1M"
  description: "dd over an EBS device"
  expect_ids: ["fs:dd_block_device"]
- test: "dd if=img of=/dev/vda"
  description: "dd over a virtio disk"
  expect_ids: ["fs:dd_block_device"]
- test: "dd if=img of=/dev/mapper/vg-data status=progress"
  description: "dd over a device-mapper volume"
  expect_ids: ["fs:dd_block_device"]
- test: "dd if=/dev/zero of=/dev/null bs=1M count=100"
  description: "negative: benchmark into /dev/null"
  expect_ids: []
- test: "dd if=/dev/sda of=/dev/stdout bs=512 count=1"
  description: "negative: reading a sector to stdout"
  expect_ids: []
- test: "dd if=file of=/dev/fd/1"
  description: "negative: a file descriptor is not a disk"
  expect_ids: []
- test: "fdisk /dev/xvdf"
  description: "partitioning an EBS device"
  expect_ids: ["fs:fdisk_disk_modify"]
- test: "parted /dev/xvdf mklabel gpt"
  description: "a new label on an EBS device"
  expect_ids: ["fs:parted_disk_modify"]
- test: "sgdisk --zap-all /dev/nvme1n1"
  description: "destroys the GPT and MBR"
  expect_ids: ["fs:sgdisk_zap"]
- test: "sgdisk -Z /dev/sdb"
  description: "short form of --zap-all"
  expect_ids: ["fs:sgdisk_zap"]
- test: "sgdisk -o /dev/sdb"
  description: "a new empty partition table"
  expect_ids: ["fs:sgdisk_zap"]
- test: "sgdisk --print /dev/sdb"
  description: "negative: printing the table"
  expect_ids: []
- test: "blkdiscard /dev/nvme1n1"
  description: "discards every block"
  expect_ids: ["fs:blkdiscard"]
- test: "blkdiscard -f /dev/xvdf"
  description: "discards every block, forced"
  expect_ids: ["fs:blkdiscard"]
- test: "mdadm --zero-superblock /dev/sdb"
  description: "erases the RAID superblock"
  expect_ids: ["fs:mdadm_zero_superblock"]
- test: "mdadm --examine /dev/sdb"
  description: "negative: reading the superblock"
  expect_ids: []
- test: "wipefs -a /dev/xvdf"
  description: "wipefs on a cloud device name"
  expect_ids: ["fs:wipefs"]

# -- runners: the command after the runner is checked --
- test: "doppler run -- rm -rf /"
  description: "doppler run -- cmd"
  expect_ids: ["fs:recursively_delete", "fs-strict:recursive_deletion"]
- test: "op run --env-file=.env -- rm -rf /"
  description: "1Password op run -- cmd"
  expect_ids: ["fs:recursively_delete", "fs-strict:recursive_deletion"]
- test: "dotenv -e .env -- rm -rf /"
  description: "dotenv-cli -- cmd"
  expect_ids: ["fs:recursively_delete", "fs-strict:recursive_deletion"]
- test: "bundle exec rm -rf /"
  description: "bundle exec cmd"
  expect_ids: ["fs:recursively_delete", "fs-strict:recursive_deletion"]
- test: "railway run rm -rf /"
  description: "railway run cmd"
  expect_ids: ["fs:recursively_delete", "fs-strict:recursive_deletion"]
- test: "xyz -- rm -rf /"
  description: "an unknown runner with -- before a risky command"
  expect_ids: ["fs:recursively_delete", "fs-strict:recursive_deletion"]
- test: "nix develop -c rm -rf /"
  description: "nix develop -c cmd"
  expect_ids: ["fs:recursively_delete", "fs-strict:recursive_deletion"]
- test: "nix-shell --run \"rm -rf /\""
  description: "nix-shell --run 'cmd'"
  expect_ids: ["fs:recursively_delete", "fs-strict:recursive_deletion"]
- test: "chronic rm -rf /"
  description: "chronic cmd"
  expect_ids: ["fs:recursively_delete", "fs-strict:recursive_deletion"]
- test: "doppler run -- npm start"
  description: "negative: a harmless command behind a runner"
  expect_ids: []
- test: "git checkout -- rm"
  description: "git's -- is followed by paths: only the git check, no rm"
  expect_ids: ["git:checkout_discard_path"]
- test: "setpriv --reuid=postgres rm -rf /"
  description: "setpriv runs the command"
  expect_ids: ["fs:recursively_delete", "fs-strict:recursive_deletion"]
- test: "chpst -u postgres rm -rf /"
  description: "chpst runs the command"
  expect_ids: ["fs:recursively_delete", "fs-strict:recursive_deletion"]
- test: "machinectl shell root@ /usr/bin/rm -rf /"
  description: "machinectl shell runs the command"
  expect_ids: ["fs:recursively_delete", "fs-strict:recursive_deletion"]
- test: "sudo -R /mnt rm -rf /etc"
  description: "sudo -R takes the chroot directory as its value"
  expect_ids: ["fs:recursively_delete", "fs-strict:recursive_deletion"]

# -- an alias in a shell startup file that makes a command run a destructive one --
- test: "echo alias ls=rm >> ~/.bashrc"
  description: "named for what it is, not as a delete of unknown files"
  expect_ids: ["fs:startup_alias_replaces_command", "fs:append_shell_startup_file"]
- test: "echo alias ll=ls >> ~/.bashrc"
  description: "a harmless alias is only the append"
  expect_ids: ["fs:append_shell_startup_file"]
- test: "echo alias g=git >> ~/.zshrc"
  description: "an alias for a non-destructive program is only the append"
  expect_ids: ["fs:append_shell_startup_file"]
