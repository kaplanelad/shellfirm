  expect_ids: ["fs-strict:recursive_deletion"]
- test: "chroot / rm -rf node_modules && npm install"
  description: "flag: the exempt command is not in command position (a runner, name or expansion in front)"
  expect_ids: ["fs-strict:recursive_deletion"]
- test: "setpriv --reuid=0 --regid=0 --init-groups rm -rf node_modules && npm install"
