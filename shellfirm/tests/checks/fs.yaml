# -- rsync dry run: only a real -n / --dry-run word counts --
- test: "rsync -av --delete site/ /srv/my-node/"
  description: "a -n inside a path is not the dry-run flag"
  expect_ids: ["fs:rsync_delete"]
- test: "rsync -a --no-perms --delete src/ /srv/www/"
  description: "--no-perms is not the dry-run flag"
  expect_ids: ["fs:rsync_delete"]
- test: "rsync -av --delete -e 'ssh -n' src/ host:/srv/www/"
  description: "a -n inside the quoted -e command is not the dry-run flag"
  expect_ids: ["fs:rsync_delete"]
- test: "rsync -av --delete --exclude='-n' src/ /srv/www/"
  description: "a -n option value is not the dry-run flag"
  expect_ids: ["fs:rsync_delete"]
- test: "rsync -av --delete src/ /srv/www/ -- -n"
  description: "-n after -- is a file name, not the dry-run flag"
  expect_ids: ["fs:rsync_delete"]
- test: "rsync -n -av --delete src/ /srv/www/"
  description: "negative: -n on its own is a dry run"
  expect_ids: []
- test: "rsync --dry-run -av --delete src/ /srv/www/"
  description: "negative: --dry-run is a dry run"
  expect_ids: []

# -- help requests: only a --help that is really parsed as help --
- test: "rm -rf build --help"
