# -- git submodule update --init after a plain pull, fetch, checkout, switch or
# clone (short option lists), with anything after it --
- test: "git pull && git submodule update --init --recursive"
  description: "negative: the steps before it cannot set the command the update runs"
  expect_ids: []
- test: "git checkout main && git submodule update --init --recursive"
  description: "negative: the steps before it cannot set the command the update runs"
  expect_ids: []
