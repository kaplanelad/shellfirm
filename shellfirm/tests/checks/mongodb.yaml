---
# -- mongodb:drop --
- test: "mongosh --eval db.users.drop()"
  description: "executing drop operations via MongoDB shell"
  expect_ids: ["mongodb:drop", "mongodb:interactive_drop_collection"]
- test: "mongosh  --eval  db.orders.drop()"
  description: "extra spaces in mongosh drop command still matches"
  expect_ids: ["mongodb:drop", "mongodb:interactive_drop_collection"]
- test: "mongosh --eval db.users.find()"
  description: "mongosh find operation should not trigger drop check"
  expect_ids: []

# -- mongodb:interactive_drop_collection --
- test: "db.users.drop()"
  description: "interactive MongoDB drop collection"
  expect_ids: ["mongodb:interactive_drop_collection"]
- test: "db.orders.drop()"
  description: "interactive MongoDB drop orders collection"
  expect_ids: ["mongodb:interactive_drop_collection"]
- test: "db.users.find()"
  description: "interactive MongoDB find should not trigger drop check"
  expect_ids: []

# -- mongodb:interactive_drop_database --
- test: "db.dropDatabase()"
  description: "interactive MongoDB drop database"
  expect_ids: ["mongodb:interactive_drop_database"]
- test: "DB.DROPDATABASE()"
  description: "interactive MongoDB drop database uppercase"
  expect_ids: ["mongodb:interactive_drop_database"]

# ====== EDGE CASE / STRESS TESTS ======

# -- mongodb:drop edge cases --
- test: "mongo --eval db.users.drop()"
  description: "match old mongo client with --eval drop"
  expect_ids: ["mongodb:drop", "mongodb:interactive_drop_collection"]
- test: "mongosh 'mongodb://localhost/test' --eval 'db.dropDatabase()'"
  description: "EDGE: connection string before --eval"
  expect_ids: ["mongodb:drop", "mongodb:interactive_drop_database"]

# -- mongodb:interactive_drop_collection edge cases --
- test: "db.my_collection.drop()"
  description: "EDGE: underscore in collection name"
  expect_ids: ["mongodb:interactive_drop_collection"]
- test: "db.my-collection.drop()"
  description: "match hyphenated collection name in drop"
  expect_ids: ["mongodb:interactive_drop_collection"]

# -- more mongo coverage --
- test: 'db.users.updateMany({}, {$set: {admin: true}})'
  description: "update every document"
  expect_ids: ["mongodb:update_all_documents"]
- test: 'db.users.updateMany({name: ''x''}, {$set: {a: 1}})'
  description: "negative: filtered update"
  expect_ids: []
- test: 'db.dropAllUsers()'
  description: "drop all users"
  expect_ids: ["mongodb:drop_all_users"]
- test: 'db.dropAllRoles()'
  description: "drop all roles"
  expect_ids: ["mongodb:drop_all_users"]
- test: 'db.dropUser(''app'')'
  description: "drop user"
  expect_ids: ["mongodb:drop_user"]
- test: 'db.shutdownServer()'
  description: "shutdown"
  expect_ids: ["mongodb:shutdown"]
- test: 'db.adminCommand({shutdown: 1})'
  description: "shutdown admin command"
  expect_ids: ["mongodb:shutdown"]

- test: "mongosh --eval 'db.users.find({name: \"drop()\"})'"
  description: "negative: drop() inside a string literal is data"
  expect_ids: []
- test: "mongosh --eval 'db.users.dropIndexes()'"
  description: "dropIndexes is Medium, not a Critical drop"
  expect_ids: ["mongodb:drop_indexes"]
- test: "db.users.dropIndex('email_1')"
  description: "interactive dropIndex"
  expect_ids: ["mongodb:drop_indexes"]
- test: "db.users.createIndex({email: 1})"
  description: "negative: create index"
  expect_ids: []
- test: "mongosh --eval 'db.dropUser(\"app\")'"
  description: "dropUser keeps its own Medium check (not mongodb:drop)"
  expect_ids: ["mongodb:drop_user"]
- test: "db.users.bulkWrite([{deleteMany: {filter: {}}}])"
  description: "bulkWrite deleteMany with an empty filter"
  expect_ids: ["mongodb:bulk_delete_all"]
- test: "db.users.bulkWrite([{deleteMany: {filter: {active: false}}}])"
  description: "negative: filtered bulk delete"
  expect_ids: []
- test: "mongorestore --drop /backup"
  description: "mongorestore --drop drops collections first"
  expect_ids: ["mongodb:mongorestore_drop"]
- test: "mongorestore --uri mongodb://x /backup"
  description: "negative: plain restore"
  expect_ids: []
- test: "mongosh --eval 'db.users.find({q: \"db.users.deleteMany({})\"})'"
  description: "negative: deleteMany({}) inside a string is data"
  expect_ids: []
- test: "mongosh --eval 'db.users.deleteMany({}); print(\"done\")'"
  description: "deleteMany({}) before a string"
  expect_ids: ["mongodb:delete_all_documents"]
- test: "mongosh --eval 'print(\"start\"); db.users.deleteMany({})'"
  description: "deleteMany({}) after a string"
  expect_ids: ["mongodb:delete_all_documents"]
- test: "mongosh --eval 'db.getSiblingDB(\"prod\").dropDatabase()'"
  description: "dropDatabase on another database handle"
  expect_ids: ["mongodb:drop", "mongodb:interactive_drop_database"]
- test: "mongosh --eval 'db.getSiblingDB(\"prod\").users.drop()'"
  description: "collection drop on another database handle"
  expect_ids: ["mongodb:drop", "mongodb:interactive_drop_collection_indirect"]

# -- mongodb:run_command_drop --
- test: "mongosh --eval 'db.runCommand({dropDatabase: 1})'"
  description: "dropDatabase as a command document"
  expect_ids: ["mongodb:run_command_drop"]
- test: "mongosh --eval 'db.getSiblingDB(\"prod\").runCommand({drop: \"users\"})'"
  description: "drop collection as a command document on another database"
  expect_ids: ["mongodb:run_command_drop"]
- test: "db.adminCommand({ \"dropDatabase\": 1 })"
  description: "adminCommand with a quoted key"
  expect_ids: ["mongodb:run_command_drop"]
- test: "db.runCommand({dropIndexes: \"users\", index: \"*\"})"
  description: "negative for run_command_drop: dropIndexes is not drop"
  expect_ids: []
- test: "db.runCommand({ping: 1})"
  description: "negative: ping"
  expect_ids: []

# -- mongodb:run_command_delete_all --
- test: "mongosh --eval 'db.runCommand({delete: \"users\", deletes: [{q: {}, limit: 0}]})'"
  description: "delete command with an empty filter"
  expect_ids: ["mongodb:run_command_delete_all"]
- test: "db.runCommand({delete: \"users\", deletes: [{q: {status: \"old\"}, limit: 0}]})"
  description: "negative: delete command with a filter"
  expect_ids: []

# -- mongodb:rename_drop_target --
- test: "db.users.renameCollection(\"archive\", true)"
  description: "renameCollection with dropTarget"
  expect_ids: ["mongodb:rename_drop_target"]
- test: "db.adminCommand({renameCollection: \"app.users\", to: \"app.archive\", dropTarget: true})"
  description: "renameCollection command with dropTarget"
  expect_ids: ["mongodb:rename_drop_target"]
- test: "db.users.renameCollection(\"archive\")"
  description: "negative: renameCollection without dropTarget"
  expect_ids: []

# -- mongoimport --drop --
- test: 'mongoimport --db app --collection users --drop --file users.json'
  description: 'mongoimport --drop'
  expect_ids: ["mongodb:mongoimport_drop"]
- test: 'mongoimport --db app --collection users --file users.json'
  description: 'negative: mongoimport without --drop'
  expect_ids: []

# -- mongorestore --dryRun --
- test: "mongorestore --drop --dryRun --dir /tmp/mongo_dump"
  description: "negative: --dryRun restores nothing"
  expect_ids: []
- test: "mongorestore --dryRun --drop --nsInclude \"shop.*\" /tmp/mongo_dump"
  description: "negative: --dryRun restores nothing"
  expect_ids: []
- test: "mongorestore --drop --dir /tmp/mongo_dump"
  description: "a real restore with --drop"
  expect_ids: ["mongodb:mongorestore_drop"]
- test: "mongorestore --drop --nsInclude \"shop.*\" /tmp/mongo_dump"
  description: "a real restore with --drop"
  expect_ids: ["mongodb:mongorestore_drop"]
- test: "mongorestore --drop --dryRun=false --dir /tmp/mongo_dump"
  description: "not the exact --dryRun word"
  expect_ids: ["mongodb:mongorestore_drop"]
- test: "mongorestore --drop --dir /tmp/mongo_dump --dryrun"
  description: "not the exact --dryRun word"
  expect_ids: ["mongodb:mongorestore_drop"]
- test: "mongorestore --drop --nsInclude=--dryRun /tmp/mongo_dump"
  description: "the word is an option value"
  expect_ids: ["mongodb:mongorestore_drop"]
- test: "mongorestore --dryRun --dir /tmp/d; mongorestore --drop --dir /tmp/d"
  description: "a real restore follows"
  expect_ids: ["mongodb:mongorestore_drop"]
- test: "mongorestore --drop --dryRun --dir /tmp/d && mongorestore --drop --dir /tmp/d"
  description: "a real restore follows"
  expect_ids: ["mongodb:mongorestore_drop"]

# -- a dry-run word right after an option that may take a value is not a dry run --
- test: "mongorestore --drop --db --dryRun dump/"
  description: "a dry-run word right after an option that may take a value is that value: a real run"
  expect_ids: ["mongodb:mongorestore_drop"]
- test: "mongorestore --drop --nsInclude --dryRun dump/"
  description: "a dry-run word right after an option that may take a value is that value: a real run"
  expect_ids: ["mongodb:mongorestore_drop"]
- test: "mongorestore --drop -d --dryRun dump/"
  description: "a dry-run word right after an option that may take a value is that value: a real run"
  expect_ids: ["mongodb:mongorestore_drop"]
- test: "mongorestore --drop --uri --dryRun dump/"
  description: "a dry-run word right after an option that may take a value is that value: a real run"
  expect_ids: ["mongodb:mongorestore_drop"]
- test: "mongorestore --drop --gzip --archive --dryRun"
  description: "--archive takes an optional value"
  expect_ids: ["mongodb:mongorestore_drop"]
- test: "mongorestore --drop '--dryRun' dump/"
  description: "a quoted dry-run word does not count as a dry run"
  expect_ids: ["mongodb:mongorestore_drop"]
- test: "mongorestore --drop --gzip --dryRun dump/"
  description: "negative: the word before the dry-run flag cannot take it as a value"
  expect_ids: []
- test: "mongorestore --drop --uri=mongodb://localhost --dryRun dump/"
  description: "negative: the word before the dry-run flag cannot take it as a value"
  expect_ids: []
- test: "mongorestore --drop --nsInclude 'shop.*' --dryRun dump/"
  description: "negative: the word before the dry-run flag cannot take it as a value"
  expect_ids: []
