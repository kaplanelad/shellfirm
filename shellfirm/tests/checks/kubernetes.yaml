  description: "oc"
  expect_ids: ["kubernetes:taint_noexecute"]
- test: 'kubectl taint nodes node-1 key=v:NoExecute-'
  description: "negative: removing the taint"
  expect_ids: []
- test: 'kubectl taint nodes node-1 key=v:NoSchedule'
  description: "negative: NoSchedule"
  expect_ids: []
- test: 'kubectl get pods -o name | xargs kubectl delete'
