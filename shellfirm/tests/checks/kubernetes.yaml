# -- round 8 (jules-r7:R7-2): anchored kubectl / helm regexes --
- test: "task delete pods --all"
  description: "negative: `task` ends in k but is not kubectl"
  expect_ids: []
- test: "task drain node1"
  description: "negative: not kubectl drain"
  expect_ids: []
- test: "check cordon node1"
  description: "negative: not kubectl cordon"
  expect_ids: []
- test: "task replace --force -f x.yaml"
  description: "negative: not kubectl replace"
  expect_ids: []
- test: "mock apply -f x --force"
  description: "negative: not kubectl apply"
  expect_ids: []
- test: "myhelm uninstall web"
  description: "negative: another tool whose name ends in helm"
  expect_ids: []
- test: "xhelm rollback web 1"
  description: "negative: not helm rollback"
  expect_ids: []
- test: "myhelm upgrade web ./chart --force"
  description: "negative: not helm upgrade"
  expect_ids: []
- test: "sudo kubectl drain node1"
  description: "sudo kubectl drain still matches"
  expect_ids: ["kubernetes:drain_node"]
- test: "env KUBECONFIG=/tmp/k kubectl cordon node1"
  description: "env-prefixed kubectl cordon still matches"
  expect_ids: ["kubernetes:cordon_node"]
- test: "/usr/local/bin/kubectl -n x delete pods --all"
  description: "a kubectl path still matches"
  expect_ids: ["kubernetes:delete_all_resources", "kubernetes-strict:delete_resource"]
- test: "k replace --force -f x.yaml"
  description: "the k alias still matches"
  expect_ids: ["kubernetes:replace_force"]
- test: "k apply -f x.yaml --force"
  description: "the k alias still matches apply --force"
  expect_ids: ["kubernetes:apply_force"]
- test: "/usr/local/bin/helm uninstall web"
  description: "a helm path still matches"
  expect_ids: ["helm:uninstall"]
- test: "sudo helm rollback web 1"
  description: "sudo helm rollback still matches"
  expect_ids: ["helm:rollback"]
- test: "helm upgrade web ./chart --force"
  description: "helm upgrade --force still matches"
  expect_ids: ["helm:upgrade_force"]
