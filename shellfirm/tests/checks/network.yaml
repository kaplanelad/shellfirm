# -- network:graphql_destructive_mutation --
- test: "curl -X POST https://api.example.com/graphql -H \"Authorization: Bearer $API_TOKEN\" -H \"Content-Type: application/json\" -d '{\"query\":\"mutation { volumeDelete(volumeId: \\\"vol_8f2c\\\") }\"}'"
  description: "volumeDelete mutation"
  expect_ids: ["network:graphql_destructive_mutation"]
- test: "curl -X POST https://api.github.com/graphql -H \"Authorization: bearer $GH_TOKEN\" -d '{\"query\":\"mutation { deleteRepository(input:{repositoryId:\\\"x\\\"}) { clientMutationId } }\"}'"
  description: "deleteRepository mutation"
  expect_ids: ["network:graphql_destructive_mutation"]
