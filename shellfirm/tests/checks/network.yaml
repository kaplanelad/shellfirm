  expect_ids: []
- test: "curl -X POST https://api.example.com/graphql -d '{\"query\":\"mutation { updateUser(input:{id:1}) { user { removedAt } } }\"}'"
  description: "negative: removed-at field in the selection"
  expect_ids: []
- test: "gh api graphql -f query='query { viewer { login } }'"
  description: "negative: gh api query"
  expect_ids: []
- test: "rg \"volumeDelete\" -n"
  description: "negative: searching code"
  expect_ids: []
- test: "git commit -F - <<'EOF'\nfeat: support volumeDelete mutation\n\nmutation { volumeDelete(id: 1) }\nEOF"
