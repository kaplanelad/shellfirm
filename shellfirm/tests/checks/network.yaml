- test: "curl -X POST https://api.github.com/graphql -H \"Authorization: bearer $T\" -d '{\"query\":\"mutation { addStar(input:{starrableId:\\\"x\\\"}) { clientMutationId } }\"}'"
  description: "negative: a harmless mutation"
  expect_ids: []
- test: "curl -X POST https://api.github.com/graphql -d '{\"query\":\"mutation { updateIssue(input:{id:\\\"x\\\", title:\\\"drop support for node 14\\\"}) { issue { id } } }\"}'"
