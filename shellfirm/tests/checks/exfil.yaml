# -- issue #189 (grep value, redirect target, --help) --
- test: 'grep -m 1 token ~/.npmrc'
  description: "grep with a value-taking option before the secret file"
  expect_ids: ["exfil:read_secret_file"]
- test: 'grep -e ~/.ssh/id_rsa README.md'
  description: "negative: the key path is the -e search pattern, not a file read"
  expect_ids: []
- test: 'cat > ~/.npmrc'
  description: "negative: writing the file (redirect target), not reading it (the redirect-overwrite check still applies, not read_secret_file)"
  expect_ids: ["fs:flush_file_content"]
- test: 'cat <<EOF > ~/.pgpass'
  description: "negative: a heredoc written into a credentials file (the redirect-overwrite check still applies, not read_secret_file)"
  expect_ids: ["fs:flush_file_content"]
- test: 'foo 2> ~/.aws/credentials'
  description: "negative: stderr redirected into the file (the redirect-overwrite check still applies, not read_secret_file)"
  expect_ids: ["fs:flush_file_content"]
- test: 'tee ~/.kube/config'
  description: "negative: tee writes the file"
  expect_ids: []
- test: 'cat f > ~/.npmrc'
  description: "negative: reads a non-secret file, writes the credentials file (the redirect-overwrite check still applies, not read_secret_file)"
  expect_ids: ["fs:flush_file_content"]
- test: 'gh auth token --help'
  description: "negative: help, not the token"
  expect_ids: []
- test: 'gh help auth'
  description: "negative: help subcommand"
  expect_ids: []
