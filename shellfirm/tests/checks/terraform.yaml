---
# -- terraform:apply_with_auto_approve --
- test: "terraform apply -auto-approve"
  description: "match command"
  expect_ids: ["terraform:apply_with_auto_approve"]
- test: "terraform    apply    -auto-approve"
  description: "match command with spaces"
  expect_ids: ["terraform:apply_with_auto_approve"]
- test: "terraform    apply    -auto-approv"
  description: "match command with spaces"
  expect_ids: []

# -- terraform:force_unlock_with_force_flag --
- test: "terraform force-unlock -force"
  description: "match command"
  expect_ids: ["terraform:force_unlock_with_force_flag"]
- test: "terraform    force-unlock    -force"
  description: "match command with spaces"
  expect_ids: ["terraform:force_unlock_with_force_flag"]
- test: "terraform  force-unlock"
  description: "invalid command"
  expect_ids: []

# -- terraform:state --
- test: "terraform state mv"
  description: "match command"
  expect_ids: ["terraform:state"]
- test: "terraform state replace-provider"
  description: "match command"
  expect_ids: ["terraform:state"]
- test: "terraform    state mv"
  description: "match command with spaces"
  expect_ids: ["terraform:state"]
- test: "terraform state mv -dry-run"
  description: "skip during the -dry-run flag"
  expect_ids: []
- test: "terraform state replace-provider -dry-run"
  description: "skip during the -dry-run flag"
  expect_ids: []

# -- terraform:workspace_delete_with_force_flag --
- test: "terraform workspace delete -lock-timeout=1 -force"
  description: "match command"
  expect_ids: ["terraform:workspace_delete_with_force_flag"]
- test: "terraform   workspace   delete  - -force"
  description: "match command with spaces"
  expect_ids: ["terraform:workspace_delete_with_force_flag"]
- test: "terraform workspace delete -lock-timeout=1"
  description: "invalid command"
  expect_ids: []

# -- terraform:workspace_delete_without_lock --
- test: "terraform workspace delete -lock=false"
  description: "match command"
  expect_ids: ["terraform:workspace_delete_without_lock"]
- test: "terraform workspace delete -lock=false -force"
  description: "match command with force"
  expect_ids: ["terraform:workspace_delete_with_force_flag", "terraform:workspace_delete_without_lock"]
- test: "terraform   workspace   delete   -lock=false"
  description: "match command with spaces"
  expect_ids: ["terraform:workspace_delete_without_lock"]
- test: "terraform workspace delete"
  description: "invalid command"
  expect_ids: []

# -- terraform:destroy_auto_approve --
- test: "terraform destroy -auto-approve"
  description: "match destroy with auto-approve"
  expect_ids: ["terraform:destroy_auto_approve"]
- test: "terraform  destroy  -auto-approve"
  description: "match destroy with extra spaces"
  expect_ids: ["terraform:destroy_auto_approve"]
- test: "terraform destroy -target=aws_instance.foo -auto-approve"
  description: "match destroy with target and auto-approve"
  expect_ids: ["terraform:destroy_auto_approve"]
- test: "terraform destroy"
  description: "negative: destroy without auto-approve should not match"
  expect_ids: ["terraform:destroy"]
- test: "terraform destroy -target=aws_instance.foo"
  description: "negative: destroy with target but no auto-approve should not match"
  expect_ids: ["terraform:destroy"]

# -- terraform:state_rm --
- test: "terraform state rm aws_instance.foo"
  description: "match state rm"
  expect_ids: ["terraform:state_rm"]
- test: "terraform  state  rm  aws_instance.foo"
  description: "match state rm with extra spaces"
  expect_ids: ["terraform:state_rm"]
- test: "terraform state rm module.foo"
  description: "match state rm with module"
  expect_ids: ["terraform:state_rm"]
- test: "terraform state list"
  description: "negative: state list should not match"
  expect_ids: []
- test: "terraform state show aws_instance.foo"
  description: "negative: state show should not match"
  expect_ids: []

# ====== EDGE CASE / STRESS TESTS ======

# -- terraform:apply_with_auto_approve edge cases --
- test: "terraform apply -var='foo=bar' -auto-approve"
  description: "EDGE: -var before -auto-approve"
  expect_ids: ["terraform:apply_with_auto_approve"]
- test: "terraform apply plan.tfplan"
  description: "applying a saved plan never asks: the plan-file check"
  expect_ids: ["terraform:apply_plan_file"]

# -- terraform:destroy_auto_approve edge cases --
- test: "terraform destroy -target=aws_instance.foo -auto-approve"
  description: "EDGE: target before auto-approve"
  expect_ids: ["terraform:destroy_auto_approve"]

# -- terraform:force_unlock edge cases --
- test: "terraform force-unlock LOCK_ID -force"
  description: "match force-unlock with -force after lock ID"
  expect_ids: ["terraform:force_unlock_with_force_flag"]

# -- terraform workspace delete / force-unlock --
- test: 'terraform workspace delete prod'
  description: "delete workspace"
  expect_ids: ["terraform:workspace_delete"]
- test: 'tofu workspace delete staging'
  description: "tofu"
  expect_ids: ["terraform:workspace_delete"]
- test: 'terraform force-unlock 1234'
  description: "force unlock"
  expect_ids: ["terraform:force_unlock"]

# -- terraform:pulumi_destroy / terraform:pulumi_stack_rm --
- test: "pulumi destroy"
  description: "destroys the stack's resources"
  expect_ids: ["terraform:pulumi_destroy"]
- test: "pulumi destroy --yes --stack prod"
  description: "with flags"
  expect_ids: ["terraform:pulumi_destroy"]
- test: "pulumi --cwd infra destroy -y"
  description: "global flag before the verb"
  expect_ids: ["terraform:pulumi_destroy"]
- test: "pulumi destroy --preview-only"
  description: "negative: preview only"
  expect_ids: []
- test: "pulumi preview --destroy"
  description: "negative: preview"
  expect_ids: []
- test: "pulumi stack rm prod"
  description: "removes a stack"
  expect_ids: ["terraform:pulumi_stack_rm"]
# -- terraform:import / taint / state_push_force (R4) --
- test: 'terraform import aws_instance.web i-123'
  description: "import"
  expect_ids: ["terraform:import"]
- test: 'terraform taint aws_instance.web'
  description: "taint"
  expect_ids: ["terraform:taint"]
- test: 'terraform state push -force old.tfstate'
  description: "forced state push"
  expect_ids: ["terraform:state_push_force"]
- test: 'terraform state push new.tfstate'
  description: "negative: state push without -force keeps the lineage checks"
  expect_ids: []
# -- round 5 (Omar R4 N7) --
- test: "terraform apply -replace=aws_instance.x"
  description: "apply -replace destroys and recreates"
  expect_ids: ["terraform:apply_replace"]
- test: "terraform plan -replace=aws_instance.x"
  description: "a plan changes nothing"
  expect_ids: []
# -- terraform:vault_secrets_destroy --
- test: "vault secrets disable secret/"
  description: "unmounting a secrets engine deletes its data"
  expect_ids: ["terraform:vault_secrets_destroy"]
- test: "vault kv metadata delete secret/prod/db"
  description: "deletes every version"
  expect_ids: ["terraform:vault_secrets_destroy"]
- test: "vault kv destroy -versions=1,2 secret/prod/db"
  description: "destroys versions permanently"
  expect_ids: ["terraform:vault_secrets_destroy"]
- test: "vault kv get secret/prod/db"
  description: "negative: reading a secret"
  expect_ids: []
- test: "vault kv delete secret/prod/db"
  description: "kv delete: permanent on KV v1, undoable on v2 (Medium)"
  expect_ids: ["terraform:vault_kv_delete"]
- test: "vault kv delete -mount=secret prod/db"
  description: "kv delete with a mount flag"
  expect_ids: ["terraform:vault_kv_delete"]
- test: "vault kv undelete -versions=3 secret/prod/db"
  description: "negative: undelete restores"
  expect_ids: []

