# -- applying a saved plan file (never asks) --
- test: "terraform apply tfplan"
  description: "a saved plan is applied without confirmation"
  expect_ids: ["terraform:apply_plan_file"]
- test: "tofu apply p"
  description: "OpenTofu, saved plan"
  expect_ids: ["terraform:apply_plan_file"]
- test: "terraform -chdir=infra apply -input=false plan.out"
  description: "options before the plan file"
  expect_ids: ["terraform:apply_plan_file"]
- test: "terraform apply"
  description: "negative: an interactive apply asks itself"
  expect_ids: []
- test: "terraform apply -target aws_instance.web"
  description: "negative: the value of -target is not a plan file"
  expect_ids: []
- test: "terraform apply -var region=eu-west-1"
  description: "negative: a variable is not a plan file"
  expect_ids: []
- test: "terraform plan -destroy -out=p && terraform apply p"
  description: "a destroy plan written and applied on the same line"
  expect_ids: ["terraform:apply_destroy_plan", "terraform:apply_plan_file"]
- test: "tofu plan -destroy -out p; tofu apply p"
  description: "OpenTofu destroy plan applied on the same line"
  expect_ids: ["terraform:apply_destroy_plan", "terraform:apply_plan_file"]
- test: "terraform plan -out=p && terraform apply p"
  description: "a normal plan applied on the same line is the plan-file check only"
  expect_ids: ["terraform:apply_plan_file"]
