name: Tests

on:
  push:
    branches:
      - main
    paths-ignore:
      - 'docs/**'
      - '**.md'
  pull_request:
    paths-ignore:
      - 'docs/**'
      - '**.md'

env:
  RUST_TOOLCHAIN: "1.99.1"
  # Keep in sync with `rust-version` in shellfirm/Cargo.toml.
  MSRV: "1.88"
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: Test Suite
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # ubuntu-24.04-arm: aarch64-linux is a release target.
        os: [ ubuntu-latest, ubuntu-24.04-arm, macos-latest, windows-latest ]
    steps:
      - name: Checkout sources
        uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}

      - uses: Swatinem/rust-cache@v2

      # Exercise embedded functions on fish >= 4.2 on both Linux runners.
      - name: Install latest fish
        if: runner.os == 'Linux'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          case "$RUNNER_ARCH" in
            X64)
              fish_arch=x86_64
              ;;
            ARM64)
              fish_arch=aarch64
              ;;
            *)
              echo "Unsupported fish architecture: $RUNNER_ARCH" >&2
              exit 1
              ;;
          esac
          fish_release=$(gh api repos/fish-shell/fish-shell/releases/latest)
          fish_version=$(jq -er '.tag_name' <<< "$fish_release")

          # Ensure fish version is greater than 4.2.0
          test "$(printf '%s\n' 4.2.0 "$fish_version" | sort -V | head -n 1)" = 4.2.0

          fish_asset=$(jq -ce --arg name "fish-$fish_version-linux-$fish_arch.tar.xz" \
            '.assets[] | select(.name == $name)' <<< "$fish_release")
          fish_url=$(jq -er '.browser_download_url' <<< "$fish_asset")
          fish_sha256=$(jq -er \
            '.digest | select(test("^sha256:[0-9a-f]{64}$")) | ltrimstr("sha256:")' <<< "$fish_asset")

          fish_dir="$RUNNER_TEMP/shellfirm-fish"
          mkdir -p "$fish_dir"
          curl --fail --location --retry 3 "$fish_url" --output "$fish_dir/fish.tar.xz"
          printf '%s  %s\n' "$fish_sha256" "$fish_dir/fish.tar.xz" | sha256sum --check

          tar -xJf "$fish_dir/fish.tar.xz" -C "$fish_dir" fish

          echo "$fish_dir" >> "$GITHUB_PATH"

          "$fish_dir/fish" --version
          # Expand these variables in fish.
          # shellcheck disable=SC2016
          "$fish_dir/fish" --no-config -c 'test "$version" = "$argv[1]"' -- "$fish_version"

      - name: Build
        run: cargo build --locked

      # Includes the check catalogue / id / group hygiene tests in
      # shellfirm/tests/checks.rs.
      - name: Run tests
        run: cargo test --locked

  msrv:
    name: MSRV build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout sources
        uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.MSRV }}

      - uses: Swatinem/rust-cache@v2

      - name: cargo build (MSRV, all features)
        run: cargo build --locked --all-features

  features:
    name: Feature isolation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout sources
        uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}

      - uses: Swatinem/rust-cache@v2

      - uses: taiki-e/install-action@cargo-hack

      # Verifies each cargo feature compiles standalone (and the
      # no-features and all-features builds), so a hidden cross-feature
      # dependency cannot slip through. Compile-only — no tests.
      # No `--no-dev-deps`: it edits Cargo.toml, so the lock file no longer
      # matches and `--locked` fails. Not needed either: `cargo check`
      # without `--tests` does not build dev-dependencies, and resolver 2
      # does not let them add features to normal dependencies.
      - name: cargo hack check --each-feature
        run: cargo hack check --locked --each-feature

  fmt:
    name: rustfmt
    runs-on: ubuntu-latest
    steps:
      - name: Checkout sources
        uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
          components: rustfmt

      - name: cargo fmt --check
        run: cargo fmt --all -- --check

  clippy:
    name: clippy
    runs-on: ubuntu-latest
    steps:
      - name: Checkout sources
        uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
          components: clippy

      - uses: Swatinem/rust-cache@v2

      # Same flags as `make clippy`.
      - name: Run clippy
        run: cargo clippy --locked --all-features -- -D warnings -W clippy::pedantic -W clippy::nursery -W rust-2018-idioms

  docs:
    name: Docs
    runs-on: ubuntu-latest
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - uses: dtolnay/rust-toolchain@stable
      with:
        toolchain: ${{ env.RUST_TOOLCHAIN }}

    - uses: Swatinem/rust-cache@v2

    - name: Check documentation
      env:
        RUSTDOCFLAGS: -D warnings
      run: cargo doc --locked --workspace --all-features --no-deps --document-private-items
