name: Tests

on:
  push:
    branches:
      - main
    paths-ignore:
      - 'docs/**'
      - '**.md'
  pull_request:
    paths-ignore:
      - 'docs/**'
      - '**.md'

env:
  RUST_TOOLCHAIN: "1.99.1"
  # Keep in sync with `rust-version` in shellfirm/Cargo.toml.
  MSRV: "1.88"
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: Test Suite
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # ubuntu-24.04-arm: aarch64-linux is a release target.
        os: [ ubuntu-latest, ubuntu-24.04-arm, macos-latest, windows-latest ]
    steps:
      - name: Checkout sources
        uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}

      - uses: Swatinem/rust-cache@v2

      # The fish hook is tested against both kinds of fish: x64 gets a
      # pinned fish 4 release (functions embedded in the binary, read
      # --tokenize-raw), arm gets Ubuntu's fish 3 (functions in files, the
      # hook's fallback tokenizer). The fish tests fail instead of skipping
      # when fish is missing on Linux CI.
      - name: Install fish 4 (pinned)
        if: runner.os == 'Linux' && runner.arch == 'X64'
        shell: bash
        env:
          FISH_VERSION: "4.7.1"
          FISH_SHA256: "345388add316b94a847b08cef01f1b46e85b98215328271ee22a21555a3204df"
        run: |
          fish_dir="$RUNNER_TEMP/shellfirm-fish"
          mkdir -p "$fish_dir"
          curl --fail --location --retry 3 \
            "https://github.com/fish-shell/fish-shell/releases/download/$FISH_VERSION/fish-$FISH_VERSION-linux-x86_64.tar.xz" \
            --output "$fish_dir/fish.tar.xz"
          printf '%s  %s\n' "$FISH_SHA256" "$fish_dir/fish.tar.xz" | sha256sum --check
          tar -xJf "$fish_dir/fish.tar.xz" -C "$fish_dir" fish
          echo "$fish_dir" >> "$GITHUB_PATH"
          "$fish_dir/fish" --version

      - name: Install fish 3 (distribution package)
        if: runner.os == 'Linux' && runner.arch == 'ARM64'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq fish
          fish --version
          fish --no-config -c 'string match -q "3.*" $version'

      - name: Build
        run: cargo build --locked

      # Includes the check catalogue / id / group hygiene tests in
      # shellfirm/tests/checks.rs.
      - name: Run tests
        run: cargo test --locked

  msrv:
    name: MSRV build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout sources
        uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.MSRV }}

      - uses: Swatinem/rust-cache@v2

      - name: cargo build (MSRV, all features)
        run: cargo build --locked --all-features

  features:
    name: Feature isolation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout sources
        uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}

      - uses: Swatinem/rust-cache@v2

      - uses: taiki-e/install-action@cargo-hack

      # Verifies each cargo feature compiles standalone (and the
      # no-features and all-features builds), so a hidden cross-feature
      # dependency cannot slip through. Compile-only — no tests.
      # No `--no-dev-deps`: it edits Cargo.toml, so the lock file no longer
      # matches and `--locked` fails. Not needed either: `cargo check`
      # without `--tests` does not build dev-dependencies, and resolver 2
      # does not let them add features to normal dependencies.
      - name: cargo hack check --each-feature
        run: cargo hack check --locked --each-feature

  fmt:
    name: rustfmt
    runs-on: ubuntu-latest
    steps:
      - name: Checkout sources
        uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
          components: rustfmt

      - name: cargo fmt --check
        run: cargo fmt --all -- --check

  clippy:
    name: clippy
    runs-on: ubuntu-latest
    steps:
      - name: Checkout sources
        uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
          components: clippy

      - uses: Swatinem/rust-cache@v2

      # Same flags as `make clippy`.
      - name: Run clippy
        run: cargo clippy --locked --all-features -- -D warnings -W clippy::pedantic -W clippy::nursery -W rust-2018-idioms

  docs:
    name: Docs
    runs-on: ubuntu-latest
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - uses: dtolnay/rust-toolchain@stable
      with:
        toolchain: ${{ env.RUST_TOOLCHAIN }}

    - uses: Swatinem/rust-cache@v2

    - name: Check documentation
      env:
        RUSTDOCFLAGS: -D warnings
      run: cargo doc --locked --workspace --all-features --no-deps --document-private-items
