name: Release
on:
  push:
    tags:
    - 'v[0-9]+.[0-9]+.[0-9]+'

env:
  RUST_TOOLCHAIN: "1.99.1"
  BIN_NAME: shellfirm
  PROJECT_NAME: shellfirm
  REPO_NAME: kaplanelad/shellfirm
  BREW_TAP: kaplanelad/homebrew-tap

jobs:
  validate:
    name: Validate release
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4

      - name: Extract tag version
        id: version
        run: |
          TAG_VERSION="${GITHUB_REF#refs/tags/v}"
          echo "version=$TAG_VERSION" >> "$GITHUB_OUTPUT"

      - name: Verify Cargo.toml matches tag
        run: |
          CARGO_VERSION=$(grep -m1 '^version' shellfirm/Cargo.toml | sed 's/version *= *"\(.*\)"/\1/')
          TAG_VERSION="${{ steps.version.outputs.version }}"
          if [ "$CARGO_VERSION" != "$TAG_VERSION" ]; then
            echo "::error::Cargo.toml version ($CARGO_VERSION) does not match tag (v$TAG_VERSION)"
            exit 1
          fi
          echo "Cargo.toml version matches tag: $CARGO_VERSION"

      - name: Check version not already released
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG_VERSION="${{ steps.version.outputs.version }}"
          if gh release view "v$TAG_VERSION" > /dev/null 2>&1; then
            echo "::error::Release v$TAG_VERSION already exists"
            exit 1
          fi
          echo "Version v$TAG_VERSION has not been released yet"

      - name: Check npm versions in sync
        id: npm-check
        run: |
          TAG_VERSION="${{ steps.version.outputs.version }}"
          ALL_MATCH=true
          for pkg in npm/shellfirm npm/cli-darwin-arm64 npm/cli-darwin-x64 npm/cli-linux-arm64 npm/cli-linux-x64 npm/cli-win32-x64; do
            PKG_VERSION=$(node -p "require('./$pkg/package.json').version")
            if [ "$PKG_VERSION" != "$TAG_VERSION" ]; then
              echo "::error::$pkg version ($PKG_VERSION) does not match tag (v$TAG_VERSION). Run: ./scripts/bump-npm-version.sh $TAG_VERSION"
              ALL_MATCH=false
            fi
          done
          if [ "$ALL_MATCH" != "true" ]; then
            echo "::error::npm package versions are out of sync. Release aborted."
            exit 1
          fi

  dist:
    name: Dist
    needs: [validate]
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        build: [x86_64-linux, aarch64-linux, x86_64-macos, aarch64-macos, x86_64-windows]
        include:
        - build: x86_64-linux
          os: ubuntu-latest
          rust: stable
          target: x86_64-unknown-linux-gnu
          cross: false
          npm_pkg: cli-linux-x64
          binary: shellfirm
        - build: aarch64-linux
          os: ubuntu-24.04-arm
          rust: stable
          target: aarch64-unknown-linux-gnu
          cross: false
          npm_pkg: cli-linux-arm64
          binary: shellfirm
        - build: x86_64-macos
          os: macos-latest
          rust: stable
          target: x86_64-apple-darwin
          cross: false
          npm_pkg: cli-darwin-x64
          binary: shellfirm
        - build: aarch64-macos
          os: macos-latest
          rust: stable
          target: aarch64-apple-darwin
          cross: false
          npm_pkg: cli-darwin-arm64
          binary: shellfirm
        - build: x86_64-windows
          os: windows-latest
          rust: stable
          target: x86_64-pc-windows-msvc
          cross: false
          npm_pkg: cli-win32-x64
          binary: shellfirm.exe


    steps:
      - name: Checkout sources
        uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }} 
          targets: ${{ matrix.target }}

      # macos-latest is an arm64 runner: test the native aarch64 build there.
      - name: Run cargo test
        if: matrix.build != 'x86_64-macos'
        run: cargo test --release --locked --target ${{ matrix.target }} 
       
      - name: Build release binary
        run: cargo build --release --locked --target ${{ matrix.target }}

      - name: Strip release binary (linux and macos)
        if: matrix.build == 'x86_64-linux' || matrix.build == 'aarch64-linux' || matrix.build == 'x86_64-macos' || matrix.build == 'aarch64-macos'
        run: strip "target/${{ matrix.target }}/release/$BIN_NAME"

      - name: Build archive
        shell: bash
        run: |
          mkdir dist
          if [ "${{ matrix.os }}" = "windows-latest" ]; then
            cp "target/${{ matrix.target }}/release/$BIN_NAME.exe" "dist/"
          else
            cp "target/${{ matrix.target }}/release/$BIN_NAME" "dist/"
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: bins-${{ matrix.build }}
          path: dist

      - name: Copy binary to npm package
        shell: bash
        run: cp target/${{ matrix.target }}/release/${{ matrix.binary }} npm/${{ matrix.npm_pkg }}/

      - name: Upload npm artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.npm_pkg }}
          path: npm/${{ matrix.npm_pkg }}/

  publish-github:
    name: Publish to GitHub Releases
    needs: [dist]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout sources
        uses: actions/checkout@v4
        with:
          submodules: false

      - uses: actions/download-artifact@v4

      - run: ls -al bins-*

      - name: Calculate tag name
        run: |
          name=dev
          if [[ $GITHUB_REF == refs/tags/v* ]]; then
            name=${GITHUB_REF:10}
          fi
          echo ::set-output name=val::$name
          echo TAG=$name >> $GITHUB_ENV
        id: tagname

      - name: Build archive
        shell: bash
        run: |
          set -ex
          rm -rf tmp
          mkdir tmp
          mkdir dist
          for dir in bins-* ; do
              platform=${dir#"bins-"}
              if [[ $platform =~ "windows" ]]; then
                  exe=".exe"
              fi
              pkgname=$PROJECT_NAME-$TAG-$platform
              mkdir tmp/$pkgname
              # cp LICENSE README.md tmp/$pkgname
              mv bins-$platform/$BIN_NAME$exe tmp/$pkgname
              chmod +x tmp/$pkgname/$BIN_NAME$exe
              if [ "$exe" = "" ]; then
                  tar cJf dist/$pkgname.tar.xz -C tmp $pkgname
              else
                  (cd tmp && 7z a -r ../dist/$pkgname.zip $pkgname)
              fi
          done
      - name: Upload binaries to release
        uses: svenstaro/upload-release-action@v2
        with:
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          file: dist/*
          file_glob: true
          tag: ${{ steps.tagname.outputs.val }}
          overwrite: true

  publish-brew:
    name: Publish to Homebrew
    needs: [publish-github]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout sources
        uses: actions/checkout@v4

      # One native binary per macOS / Linux architecture: Apple Silicon must
      # not get the x86_64 build.
      - name: Render formula
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${GITHUB_REF#refs/tags/}"
          gh release download "$TAG" --repo "$REPO_NAME" --dir assets --pattern '*-macos.tar.xz' --pattern '*-linux.tar.xz'
          ./scripts/render-homebrew-formula.sh "$TAG" assets > "$PROJECT_NAME.rb"
          ruby -c "$PROJECT_NAME.rb"
          cat "$PROJECT_NAME.rb"

      - name: Push formula to the tap
        env:
          GH_TOKEN: ${{ secrets.COMMITTER_TOKEN }}
        run: |
          FORMULA="$PROJECT_NAME.rb"
          SHA=$(gh api "repos/$BREW_TAP/contents/$FORMULA" --jq .sha)
          gh api --method PUT "repos/$BREW_TAP/contents/$FORMULA" \
            -f message="updating formula for $PROJECT_NAME ${GITHUB_REF#refs/tags/}" \
            -f content="$(base64 -w0 "$FORMULA")" \
            -f sha="$SHA" > /dev/null

  publish-npm:
    name: Publish to npm
    needs: [validate, dist]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          registry-url: https://registry.npmjs.org

      - name: Download all npm artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Prepare platform packages
        run: |
          for pkg in cli-darwin-arm64 cli-darwin-x64 cli-linux-arm64 cli-linux-x64 cli-win32-x64; do
            cp -r artifacts/$pkg/* npm/$pkg/
          done

      - name: Publish platform packages
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          for pkg in cli-darwin-arm64 cli-darwin-x64 cli-linux-arm64 cli-linux-x64 cli-win32-x64; do
            npm publish ./npm/$pkg --access public
          done

      - name: Publish main package
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: npm publish ./npm/shellfirm --access public

  publish-crates:
    name: Publish to crates.io
    needs: [validate, dist]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
      - run: cargo publish -p shellfirm
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
